<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoko — 書庫</title>
<meta name="description" content="観た映画・ドラマ・アニメを記録する、自分だけの書庫。">
<meta name="theme-color" content="#121822">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --ink:#121822; --ink-deep:#0C1017; --panel:#1A222E; --panel-2:#222C3A; --line:#2E3948;
    --paper:#E9E3D5; --paper-dim:#9BA3AF; --brass:#C8A45D; --brass-dim:#8A7440;
    --jade:#4F8A6E; --seal:#B5503C; --slate:#606B7C;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP","Helvetica Neue",sans-serif;
    --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--gothic);
       font-size:15px;line-height:1.6;padding-bottom:100px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:20;background:var(--ink);padding:14px 0 6px;
         border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0;letter-spacing:.24em}
  .brand small{font-size:10px;letter-spacing:.18em;color:var(--brass-dim);font-family:var(--mincho)}
  .brand .sp{flex:1}
  .icobtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
          color:var(--paper-dim);font-size:15px;border:1px solid transparent}
  .icobtn.on{color:var(--brass);border-color:var(--brass-dim)}

  .searchbar{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--panel);
             border:1px solid var(--line);border-radius:var(--r);padding:7px 11px}
  .searchbar input{background:none;border:none;outline:none;width:100%;font-size:14px}
  .searchbar input::placeholder{color:#5D6675}

  /* 状態タブ：一番上、いちばん目立つ場所に */
  .statbar{display:flex;gap:5px;overflow-x:auto;margin-top:11px;scrollbar-width:none}
  .statbar::-webkit-scrollbar{display:none}
  .statbar button{flex:0 0 auto;padding:7px 12px;border-radius:var(--r);font-size:13px;
                  color:var(--paper-dim);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
  .statbar button b{font-weight:400;font-size:11px;opacity:.65}
  .statbar button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-color:transparent}
  .statbar button[aria-pressed="true"] b{opacity:.75}
  .statbar button[data-s="all"][aria-pressed="true"]{background:var(--paper)}
  .statbar button[data-s="want"][aria-pressed="true"]{background:var(--slate);color:var(--paper)}
  .statbar button[data-s="watching"][aria-pressed="true"]{background:var(--brass)}
  .statbar button[data-s="done"][aria-pressed="true"]{background:var(--jade);color:#0C1017}
  .statbar button[data-s="paused"][aria-pressed="true"]{background:var(--panel-2);color:var(--paper)}
  .statbar button[data-s="dropped"][aria-pressed="true"]{background:var(--seal);color:var(--paper)}

  .catbar{display:flex;gap:14px;overflow-x:auto;padding:9px 0 8px;scrollbar-width:none}
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{flex:0 0 auto;font-size:12.5px;color:#5D6675;padding:1px 0 4px;border-bottom:1.5px solid transparent}
  .catbar button[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--brass)}

  .recall{margin:12px 0 2px;border:1px solid var(--line);border-left:2px solid var(--brass);
          background:var(--panel);border-radius:var(--r);padding:11px 12px;display:flex;gap:11px;align-items:center;width:100%}
  .recall .eyebrow{font-family:var(--mincho);font-size:10px;letter-spacing:.2em;color:var(--brass);display:block;margin-bottom:3px}
  .recall .t{font-family:var(--mincho);font-size:15px;line-height:1.35}
  .recall .m{font-size:11px;color:var(--paper-dim);margin-top:3px}
  .recall img{width:42px;height:61px;object-fit:cover;border-radius:2px;flex:0 0 auto;background:var(--panel-2)}
  .recall .body{flex:1;min-width:0;text-align:left}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
  .cover{position:relative;aspect-ratio:2/3;background:var(--panel-2);border-radius:2px;
         overflow:hidden;border:1px solid var(--line);display:block;width:100%}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover.blur img{filter:blur(13px) saturate(.5)}
  .cover .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:8px;
                font-family:var(--mincho);font-size:11.5px;color:#8A93A1;text-align:center;line-height:1.5}
  /* 状態の帯 */
  .flag{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:11px;font-weight:700;
        letter-spacing:.08em;text-align:center;line-height:1.3}
  .flag.want{background:rgba(96,107,124,.94);color:#E9E3D5}
  .flag.watching{background:rgba(200,164,93,.96);color:#0C1017}
  .flag.done{background:rgba(79,138,110,.95);color:#0C1017}
  .flag.paused{background:rgba(34,44,58,.95);color:#9BA3AF}
  .flag.dropped{background:rgba(181,80,60,.94);color:#F3E8E4}
  .rbadge{position:absolute;top:5px;left:5px;background:rgba(12,16,23,.82);border:1px solid var(--brass-dim);
          color:var(--brass);font-size:10.5px;padding:1px 5px;border-radius:2px;letter-spacing:.03em}

  .empty{margin-top:56px;text-align:center;color:var(--paper-dim)}
  .empty .k{font-family:var(--mincho);font-size:34px;color:#2E3948;letter-spacing:.3em}
  .empty p{font-size:13px;margin:14px 0 0}

  .fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
       width:54px;height:54px;border-radius:50%;background:var(--brass);color:var(--ink-deep);
       font-size:26px;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.5);font-weight:300}

  .scrim{position:fixed;inset:0;background:rgba(6,9,13,.72);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;
         background:var(--ink-deep);border-top:1px solid var(--line);border-radius:12px 12px 0 0;
         transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
         padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:var(--ink-deep);padding:14px 0 10px;z-index:2;
              display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-family:var(--mincho);font-size:15px;letter-spacing:.14em;margin:0;flex:1;font-weight:600}
  .sheet-body{padding-top:14px;max-width:760px;margin:0 auto}
  @media(min-width:760px){.sheet{border-radius:12px;left:50%;transform:translate(-50%,100%);width:720px}
                          .sheet.open{transform:translate(-50%,0)}}

  label.f{display:block;font-size:11px;letter-spacing:.12em;color:var(--brass-dim);
          font-family:var(--mincho);margin:18px 0 7px}
  .in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:9px 11px;outline:none;font-size:14px}
  .in:focus{border-color:var(--brass-dim)}
  textarea.in{min-height:96px;resize:vertical;line-height:1.7}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{background:var(--brass);color:var(--ink-deep);font-weight:700;border-radius:var(--r);
       padding:11px;width:100%;font-size:14px;letter-spacing:.06em}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--paper);font-weight:400}
  .btn.danger{background:none;border:1px solid var(--seal);color:var(--seal);font-weight:400}
  .btn.danger.armed{background:var(--seal);color:#fff;font-weight:700}
  .seg{display:flex;gap:5px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;font-size:13px;color:var(--paper-dim)}
  .seg button[aria-pressed="true"]{background:var(--panel-2);border-color:var(--brass-dim);color:var(--brass);font-weight:700}

  /* 状態選択：詳細画面の最上部、色つきで大きく */
  .statpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .statpick button{border:1px solid var(--line);border-radius:var(--r);padding:10px 4px;font-size:13px;color:var(--paper-dim)}
  .statpick button[data-s="want"][aria-pressed="true"]{background:var(--slate);color:var(--paper);border-color:var(--slate);font-weight:700}
  .statpick button[data-s="watching"][aria-pressed="true"]{background:var(--brass);color:var(--ink-deep);border-color:var(--brass);font-weight:700}
  .statpick button[data-s="done"][aria-pressed="true"]{background:var(--jade);color:var(--ink-deep);border-color:var(--jade);font-weight:700}
  .statpick button[data-s="paused"][aria-pressed="true"]{background:var(--panel-2);color:var(--paper);border-color:#485468;font-weight:700}
  .statpick button[data-s="dropped"][aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal);font-weight:700}

  .rate{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .rate button{border:1px solid var(--line);border-radius:var(--r);padding:9px 2px;font-size:13px;color:var(--paper-dim)}
  .rate button[aria-pressed="true"]{background:var(--brass);color:var(--ink-deep);border-color:var(--brass);font-weight:700}
  .rateNote{font-size:12px;color:var(--paper-dim);margin-top:7px;min-height:1.5em}

  .res{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:center}
  .res img{width:42px;height:62px;object-fit:cover;border-radius:2px;background:var(--panel-2);flex:0 0 auto}
  .res .t{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .res .m{font-size:11px;color:#6C7686;margin-top:2px}
  .res .add{color:var(--brass);font-size:20px;flex:0 0 auto;padding:0 4px}

  .dhead{display:flex;gap:14px;align-items:flex-start}
  .dhead .cv{width:88px;flex:0 0 auto}
  .dhead h3{font-family:var(--mincho);font-size:18px;line-height:1.45;margin:0 0 6px;font-weight:600}
  .meta{font-size:11.5px;color:var(--paper-dim);letter-spacing:.04em}
  .syn{font-size:12.5px;color:var(--paper-dim);line-height:1.75;margin-top:12px;max-height:5.3em;overflow:hidden}
  .syn.open{max-height:none}
  .more{font-size:11px;color:var(--brass);margin-top:3px}

  .log{border-left:2px solid var(--line);padding:0 0 16px 13px;position:relative;margin-left:3px}
  .log:last-child{padding-bottom:2px}
  .log::before{content:"";position:absolute;left:-4.5px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--brass-dim)}
  .log .d{font-size:11px;color:var(--brass-dim);letter-spacing:.1em;font-family:var(--mincho)}
  .log .b{font-size:13.5px;line-height:1.8;white-space:pre-wrap;margin-top:3px}
  .log .del{font-size:11px;color:#5D6675;margin-top:4px}

  .prog{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin:9px 0 4px}
  .prog i{display:block;height:100%;background:var(--brass);transition:width .25s}
  .eps{display:flex;gap:5px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .eps::-webkit-scrollbar{display:none}
  .eps button{flex:0 0 auto;min-width:38px;padding:7px 8px;border:1px solid var(--line);
              border-radius:var(--r);font-size:12.5px;color:var(--paper-dim);position:relative}
  .eps button.seen{border-color:var(--jade);color:var(--jade)}
  .eps button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);
              color:var(--ink-deep);font-weight:700}
  .eptitle{font-size:12px;color:var(--paper);background:var(--panel);border:1px solid var(--line);
           border-radius:var(--r);padding:7px 10px;line-height:1.5;margin-bottom:8px}
  .eptitle b{color:var(--brass);font-weight:400;font-family:var(--mincho);margin-right:7px}
  .epbadge{position:absolute;top:5px;right:5px;background:rgba(12,16,23,.82);border:1px solid #485468;
           color:var(--paper-dim);font-size:10px;padding:1px 5px;border-radius:2px;letter-spacing:.02em}
  .sectitle{font-family:var(--mincho);font-size:15px;letter-spacing:.1em;margin:0 0 10px;
            display:flex;align-items:baseline;gap:9px;border-left:2px solid var(--brass);padding-left:9px}
  .sectitle span{font-family:var(--gothic);font-size:10.5px;letter-spacing:0;color:#6C7686;font-weight:400}
  .hint{font-size:11.5px;color:#6C7686;line-height:1.7;margin-top:7px}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .backupbar{background:var(--panel-2);border-bottom:1px solid var(--brass-dim);
             padding:9px 14px;font-size:12px;color:var(--paper);display:flex;gap:10px;align-items:center}
  .backupbar button{color:var(--brass);font-size:12px;text-decoration:underline;flex:0 0 auto}
  .backupbar .x{color:#5D6675;text-decoration:none}
  footer{max-width:760px;margin:34px auto 0;padding:18px 14px 0;border-top:1px solid var(--line);
         font-size:10.5px;color:#5A6472;line-height:1.8}
  footer a{color:#6C7686}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
         background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--paper);
         padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
        border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="backupBar"></div>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>書庫</h1><small id="verLabel"></small>
      <span class="sp"></span>
      <button class="icobtn" id="safeBtn" title="伏せ字表示">◐</button>
      <button class="icobtn" id="setBtn" title="設定">⚙</button>
    </div>
    <div class="searchbar"><span style="color:#5D6675">検索</span>
      <input id="q" placeholder="棚の中を探す" autocomplete="off"></div>
    <div class="statbar" id="statbar"></div>
    <div class="catbar" id="catbar"></div>
  </div>
</header>

<main class="wrap">
  <div id="recall"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="k">空</div><p>まだ何も収めていません。<br>右下の ＋ から一本目を。</p>
  </div>
</main>

<button class="fab" id="fab" aria-label="作品を追加">＋</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2>
  <button class="icobtn" id="closeSheet">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<footer class="wrap">
  <div>Shoko — 記録はこの端末の中だけに保存されます。</div>
  <div style="margin-top:6px">This product uses the TMDB API but is not endorsed or certified by TMDB.
    アニメ情報の一部は AniList のデータを利用しています。</div>
</footer>

<script>
(()=>{
"use strict";
const VERSION='1.0.0';   // 表示用
const SCHEMA=3;          // データ構造の版。移行判定に使う
const CHANGES=[
  ['1.0.0','GitHub 公開版。端末内保存（IndexedDB）に移行。ホーム画面へのインストール、共有メニューからの追加、バックアップの促しを追加。'],
  ['0.5.1','設定に接続チェックを追加。'],
  ['0.5.0','アニメ検索が AniList 不通時に TMDB へ切り替わるように。分類の変更を追加。'],
  ['0.4.0','話数の枠を API から取り込めるように。進捗表示と自動送りを追加。'],
  ['0.3.0','総評と話数ごとの記録を分離。タグを廃止。バージョン表示を追加。'],
  ['0.2.0','状態を色帯で明示。評価を数値＋言葉に。削除を二段階方式に。'],
  ['0.1.0','最初の版。'],
];
const KW='shoko:works', KS='shoko:settings';
const CATS={movie:'映画',drama:'ドラマ',anime:'アニメ',doujin:'同人'};
const STAT={
  want:'これから見る', watching:'見ている途中', done:'見た',
  paused:'一時中断', dropped:'見るのをやめた'
};
const RATE=['','合わなかった','いまひとつ','良かった','とても良い','忘れたくない'];
let works=[], settings={tmdbKey:'',safe:false,lastExport:0,backupHiddenUntil:0}, filter={cat:'all',stat:'all',q:''};
const imgCache=new Map();
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

/* ---------- 保存層：IndexedDB（この端末の中だけ） ---------- */
const DB_NAME='shoko-db', STORE='kv';
let dbPromise=null, memFallback=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('IndexedDB がありません'));
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error||new Error('IndexedDB を開けません'));
  }).catch(e=>{ memFallback=new Map(); throw e; });
  return dbPromise;
}
function tx(mode){ return openDB().then(d=>d.transaction(STORE,mode).objectStore(STORE)); }
async function sget(k){
  if(memFallback) return memFallback.has(k)? memFallback.get(k) : null;
  try{
    const st=await tx('readonly');
    return await new Promise((res,rej)=>{ const q=st.get(k);
      q.onsuccess=()=>res(q.result===undefined?null:q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ if(!memFallback) memFallback=new Map(); return memFallback.get(k)??null; }
}
async function sset(k,v){
  if(memFallback){ memFallback.set(k,v); return false; }
  try{
    const st=await tx('readwrite');
    await new Promise((res,rej)=>{ const q=st.put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
    return true;
  }catch(e){
    if(!memFallback) memFallback=new Map();
    memFallback.set(k,v);
    toast('保存できませんでした（プライベートモードの可能性）');
    return false;
  }
}
async function sdel(k){
  if(memFallback){ memFallback.delete(k); return; }
  try{ const st=await tx('readwrite');
    await new Promise((res,rej)=>{ const q=st.delete(k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}
const saveWorks=()=>sset(KW,works);
const saveSettings=()=>sset(KS,settings);

async function resolveCover(w){
  if(!w.cover) return '';
  if(!w.cover.startsWith('local:')) return w.cover;
  if(imgCache.has(w.id)) return imgCache.get(w.id);
  const d=(await sget('shoko:img:'+w.id))||''; imgCache.set(w.id,d); return d;
}

/* ---------- filters ---------- */
function countBy(stat){
  return works.filter(w=>(filter.cat==='all'||w.cat===filter.cat)&&(stat==='all'||w.status===stat)).length;
}
function buildBars(){
  const sb=$('#statbar'); sb.innerHTML='';
  const add=(key,label)=>{
    const b=el('button'); b.dataset.s=key;
    b.innerHTML=esc(label)+' <b>'+countBy(key)+'</b>';
    b.setAttribute('aria-pressed',filter.stat===key);
    b.onclick=()=>{filter.stat=key;buildBars();render();}; sb.appendChild(b);
  };
  add('all','すべて'); add('want','これから'); add('watching','見てる');
  add('done','見た'); add('paused','中断'); add('dropped','やめた');

  const cb=$('#catbar'); cb.innerHTML='';
  const addc=(key,label)=>{const b=el('button');b.textContent=label;
    b.setAttribute('aria-pressed',filter.cat===key);
    b.onclick=()=>{filter.cat=key;buildBars();render();};cb.appendChild(b);};
  addc('all','ぜんぶ'); Object.entries(CATS).forEach(([k,v])=>addc(k,v));
}

/* ---------- render ---------- */
async function render(){
  buildBars();
  const q=filter.q.trim().toLowerCase();
  const list=works.filter(w=>
    (filter.cat==='all'||w.cat===filter.cat)&&
    (filter.stat==='all'||w.status===filter.stat)&&
    (!q||(w.title+' '+(w.maker||'')+' '+(w.review||'')).toLowerCase().includes(q))
  ).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  const g=$('#grid'); g.innerHTML='';
  $('#empty').style.display = works.length? 'none':'block';
  if(works.length && !list.length){
    const d=el('div');d.style.cssText='grid-column:1/-1;color:var(--paper-dim);font-size:13px;padding:30px 0;text-align:center';
    d.textContent='ここには何もありません。';g.appendChild(d);
  }
  for(const w of list) g.appendChild(await cardEl(w));
  renderRecall();
}

async function cardEl(w){
  const b=el('button','cover'+(settings.safe&&w.adult?' blur':''));
  const src=await resolveCover(w);
  if(src){const im=el('img');im.src=src;im.alt=w.title;im.loading='lazy';b.appendChild(im);}
  else{const n=el('div','noimg');n.textContent=w.title;b.appendChild(n);}
  if(w.rating){const r=el('div','rbadge');r.textContent='★'+w.rating;b.appendChild(r);}
  const eps=(w.episodes||[]).length;
  if(eps){
    const seen=new Set((w.logs||[]).map(l=>l.epKey).filter(Boolean)).size;
    if(seen<eps || w.status==='watching'){
      const p=el('div','epbadge'); p.textContent=seen+'/'+eps; b.appendChild(p);}
  }
  const f=el('div','flag '+w.status); f.textContent=({want:'これから',watching:'見てる',done:'見た',paused:'中断',dropped:'やめた'})[w.status];
  b.appendChild(f);
  b.onclick=()=>openDetail(w.id);
  return b;
}

async function renderRecall(){
  const box=$('#recall'); box.innerHTML='';
  if(works.length<3) return;
  const md=today().slice(5), yr=new Date().getFullYear();
  let pick=null,note='';
  for(const w of works) for(const l of (w.logs||[])){
    if(l.date && l.date.slice(5)===md && +l.date.slice(0,4)<yr){
      pick=w; note=(yr-+l.date.slice(0,4))+'年前の今日、記録しています'; break;}}
  if(!pick){
    const pool=works.filter(w=>w.status==='done'); if(!pool.length) return;
    pick=pool[+today().replace(/-/g,'')%pool.length];
    const last=[...(pick.logs||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    note=last?.date?('最後の記録は '+last.date):'記録はまだありません';}
  const card=el('button','recall');
  const src=await resolveCover(pick);
  if(src){const im=el('img');im.src=src;im.alt='';if(settings.safe&&pick.adult)im.style.filter='blur(8px)';card.appendChild(im);}
  const body=el('div','body');
  body.innerHTML='<span class="eyebrow">掘り起こし</span><div class="t">'+esc(pick.title)+'</div><div class="m">'+esc(note)+'</div>';
  card.appendChild(body); card.onclick=()=>openDetail(pick.id); box.appendChild(card);
}

async function runSearch(kind,q){
  const r=$('#results'); if(!q){r.innerHTML='';return;}
  r.innerHTML='<div class="hint"><span class="spin"></span> 探しています…</div>';
  let items=[], note='', failMsg='';

      items=await tmdbSearch(q);
    }else{
      // アニメは AniList を先に試し、届かなければ TMDB に切り替える
      try{ items=await anilistSearch(q); }
      catch(e){ failMsg=e.message||'AniList に接続できませんでした'; }
      if(!items.length){
        if(settings.tmdbKey){
          items=await tmdbSearch(q,'anime');
          note = failMsg ? 'AniList に届かなかったため、TMDB の結果です。'
                         : 'AniList に無かったため、TMDB の結果です。';
        }else if(failMsg){
          throw new Error(failMsg+'。TMDB のキーを登録すると、そちらから探せます。');
        }
      }
    }
    if(!items.length){
      r.innerHTML='<div class="hint">見つかりませんでした。表記を変えるか、「手で入れる」から登録してください。</div>';return;}
    r.innerHTML = note? `<div class="hint" style="margin:0 0 6px">${esc(note)}</div>`:'';
    items.forEach(it=>{
      const b=el('button','res');
      b.innerHTML=(it.cover?`<img src="${esc(it.cover)}" alt="" loading="lazy">`:'<img alt="">')+

         <div class="m">${esc([CATS[it.cat],it.year].filter(Boolean).join(' · '))}</div></div><span class="add">＋</span>`;
      b.onclick=()=>addFromApi(it); r.appendChild(b);});
  }catch(e){
    r.innerHTML=`<div class="hint">${esc(e.message||'取得に失敗しました。')}</div>
      <div style="height:10px"></div>
      <button class="btn ghost" id="toManual">手で入れる</button>`;
    $('#toManual').onclick=()=>{
      [...$('#srcSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='manual'));
      addArea('manual');};
  }
}
async function tmdbSearch(q,forceCat){
  const u='https://api.themoviedb.org/3/search/multi?language=ja-JP&include_adult=false&query='
    +encodeURIComponent(q)+'&api_key='+encodeURIComponent(settings.tmdbKey);
  const res=await fetch(u); if(!res.ok) throw new Error('TMDB への接続に失敗しました（キーを確認してください）');
  const d=await res.json();
  return (d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').map(x=>({
    title:x.title||x.name, cat: forceCat || (x.media_type==='movie'?'movie':'drama'),
    year:(x.release_date||x.first_air_date||'').slice(0,4),
    cover:x.poster_path?'https://image.tmdb.org/t/p/w342'+x.poster_path:'',
    synopsis:x.overview||'', source:'tmdb:'+x.id}));
}
async function anilistSearch(q){
  const query=`query($q:String){Page(perPage:15){media(search:$q,type:ANIME){id startDate{year}
    title{native romaji} coverImage{large} description(asHtml:false)}}}`;
  const res=await fetch('https://graphql.anilist.co',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{q}})});
  if(!res.ok) throw new Error('AniList が応答しませんでした（'+res.status+'）');
  const d=await res.json();
  return (d.data?.Page?.media||[]).map(m=>({
    title:m.title.native||m.title.romaji, cat:'anime', year:m.startDate?.year||'',
    cover:m.coverImage?.large||'', synopsis:(m.description||'').replace(/<[^>]+>/g,''),
    source:'anilist:'+m.id}));
}

function shrink(file){
  return new Promise((res,rej)=>{const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const W=400,h=Math.round(im.height*W/im.width);
        const c=document.createElement('canvas');c.width=W;c.height=h;
        c.getContext('2d').drawImage(im,0,0,W,h);res(c.toDataURL('image/jpeg',.8));};
      im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);});
}

/* ---------- 話数の取り込み ---------- */
// TMDB の TV は全シーズンの各話タイトル・放送日まで取れる。
// AniList は総話数しか持たないので、番号だけの枠を作る。
async function fetchEpisodesTMDB(tvId){
  const base='https://api.themoviedb.org/3/tv/'+tvId+'?language=ja-JP&api_key='+encodeURIComponent(settings.tmdbKey);
  const det=await (await fetch(base)).json();
  const seasons=(det.seasons||[]).filter(s=>s.season_number>0).slice(0,20);
  const out=[];
  for(const s of seasons){
    const u='https://api.themoviedb.org/3/tv/'+tvId+'/season/'+s.season_number
      +'?language=ja-JP&api_key='+encodeURIComponent(settings.tmdbKey);
    const sd=await (await fetch(u)).json();
    (sd.episodes||[]).forEach(e=>out.push({
      k:s.season_number+'-'+e.episode_number, s:s.season_number, n:e.episode_number,
      title:e.name||'', air:e.air_date||''}));
  }
  return {episodes:out, multiSeason:seasons.length>1};
}
async function fetchEpisodeCountAniList(id){
  const query=`query($id:Int){Media(id:$id){episodes nextAiringEpisode{episode}}}`;
  const r=await fetch('https://graphql.anilist.co',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{id:+id}})});
  const d=await r.json();
  const m=d.data?.Media||{};
  return m.episodes || (m.nextAiringEpisode?.episode ? m.nextAiringEpisode.episode-1 : 0);
}
function makeNumberedEpisodes(n){
  return Array.from({length:n},(_,i)=>({k:'1-'+(i+1),s:1,n:i+1,title:'',air:''}));
}
const epLabel=(e,multi)=> (multi?e.s+'-'+e.n : '第'+e.n+'話');
const epText=(e,multi)=> (multi?`S${e.s} 第${e.n}話` : `第${e.n}話`)+(e.title?'　'+e.title:'');

/* ---------- detail ---------- */
async function openDetail(id){
  const w=works.find(x=>x.id===id); if(!w)return;
  const src=await resolveCover(w);
  openSheet(CATS[w.cat],`
    <div class="dhead">
      <div class="cv"><div class="cover${settings.safe&&w.adult?' blur':''}">
        ${src?`<img src="${esc(src)}" alt="">`:`<div class="noimg">${esc(w.title)}</div>`}
        <div class="flag ${w.status}" id="dFlag"></div></div></div>
      <div style="flex:1;min-width:0">
        <h3>${esc(w.title)}</h3>
        <div class="meta">${esc([w.maker,w.year].filter(Boolean).join(' · ')||'—')}</div>
        <div class="meta" id="cnt" style="margin-top:6px"></div></div></div>

    <label class="f" style="margin-top:20px">いまの状態</label>
    <div class="statpick" id="stSeg">${Object.entries(STAT).map(([k,v])=>
      `<button data-s="${k}" aria-pressed="${w.status===k}">${v}</button>`).join('')}</div>

    <label class="f">分類</label>
    <div class="seg" id="catSeg">${Object.entries(CATS).map(([k,v])=>
      `<button data-c="${k}" aria-pressed="${w.cat===k}">${v}</button>`).join('')}</div>

    <label class="f">評価</label>
    <div class="rate" id="rate">${[0,1,2,3,4,5].map(v=>
      `<button data-v="${v}" aria-pressed="${w.rating===v}">${v===0?'なし':v}</button>`).join('')}</div>
    <div class="rateNote" id="rateNote"></div>

    ${w.synopsis?`<label class="f">あらすじ</label><div class="syn" id="syn">${esc(w.synopsis)}</div>
      <button class="more" id="synMore">続きを読む</button>`:''}

    <div class="divider"></div>
    <div class="sectitle">総評<span>この作品にひとつ。書き直せます</span></div>
    <textarea class="in" id="rvBody" placeholder="全部見終えたあと、この作品をどう思ったか。">${esc(w.review||'')}</textarea>
    <div class="row" style="margin-top:9px;align-items:center">
      <span class="hint" id="rvMeta" style="margin:0;flex:1"></span>
      <button class="btn" id="rvSave" style="flex:0 0 110px">総評を保存</button></div>

    <div class="divider"></div>
    <div class="sectitle">話数の記録<span>見るたびに増えていきます</span></div>
    <div id="epArea"></div>
    <div class="row" style="margin-bottom:8px">
      <input class="in" type="date" id="lgDate" value="${today()}" style="flex:1.15">
      <input class="in" id="lgEp" placeholder="第3話 / 2巻 など"></div>
    <textarea class="in" id="lgBody" placeholder="そのとき思ったことを、ひとことでも。" style="min-height:72px"></textarea>
    <div style="height:9px"></div><button class="btn ghost" id="lgSave">この回を記録する</button>
    <div id="logs" style="margin-top:16px"></div>

    <div class="divider"></div>
    <button class="btn danger" id="del">この作品を書庫から外す</button>
    <div class="hint" id="delHint"></div>`);

  /* ---- 話数エリア ---- */
  let selKey=null;
  const seenKeys=()=>new Set((w.logs||[]).map(l=>l.epKey).filter(Boolean));
  function paintEpisodes(){
    const a=$('#epArea'); a.innerHTML='';
    const eps=w.episodes||[];
    const canFetch = /^(tmdb|anilist):/.test(w.source||'');

    if(!eps.length){
      if(w.cat==='movie'||w.cat==='doujin'){
        a.innerHTML='<div class="hint" style="margin-top:0">巻数や再視聴の回数は、右の欄に自由に書けます。</div>'
          +'<div style="height:10px"></div>';
        addManualCount(a); return;
      }
      const b=el('button','btn ghost'); b.id='epFetch';
      b.textContent = canFetch? '話数を取り込む' : '話数を作る';
      a.appendChild(b);
      const h=el('div','hint');
      h.textContent = canFetch
        ? (w.source.startsWith('tmdb')? 'TMDB から各話のタイトルと放送日を取り込みます。'
           : 'AniList からは総話数のみ取り込めます（サブタイトルは付きません）。')
        : '総話数を入れると、第1話からの枠を作ります。';
      a.appendChild(h);
      b.onclick=()=>importEpisodes(b,h);
      if(!canFetch){a.innerHTML='';addManualCount(a);}
      return;
    }

    const seen=seenKeys();
    const done=eps.filter(e=>seen.has(e.k)).length;
    const multi=eps.some(e=>e.s>1);
    const bar=el('div');
    bar.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--paper-dim)">
      <span>全${eps.length}話中 ${done}話を記録</span>
      <button id="epReset" style="font-size:11px;color:#5D6675">枠を作り直す</button></div>
      <div class="prog"><i style="width:${eps.length?done/eps.length*100:0}%"></i></div>`;
    a.appendChild(bar);

    if(selKey===null){
      const next=eps.find(e=>!seen.has(e.k));
      selKey = next? next.k : eps[eps.length-1].k;
    }
    const cur=eps.find(e=>e.k===selKey);
    if(cur){const t=el('div','eptitle');
      t.innerHTML=`<b>${esc(multi?`S${cur.s} 第${cur.n}話`:`第${cur.n}話`)}</b>`
        +esc(cur.title|| (cur.air? cur.air+' 放送':'サブタイトルなし'));
      a.appendChild(t);}

    const row=el('div','eps');
    eps.forEach(e=>{
      const b=el('button'); b.textContent=epLabel(e,multi);
      if(seen.has(e.k)) b.classList.add('seen');
      b.setAttribute('aria-pressed', e.k===selKey);
      b.onclick=()=>{selKey=e.k; $('#lgEp').value=epText(e,multi); paintEpisodes();};
      row.appendChild(b);
    });
    a.appendChild(row);
    $('#lgEp').value = cur? epText(cur,multi) : '';
    $('#epReset').onclick=async()=>{w.episodes=[];selKey=null;await saveWorks();paintEpisodes();};
    requestAnimationFrame(()=>{const sel=row.querySelector('[aria-pressed="true"]');
      if(sel) row.scrollLeft=Math.max(0,sel.offsetLeft-90);});
  }
  function addManualCount(a){
    const r=el('div','row');
    r.innerHTML=`<input class="in" id="epNum" inputmode="numeric" placeholder="総話数・巻数">
      <button class="btn ghost" id="epMake" style="flex:0 0 92px">枠を作る</button>`;
    a.appendChild(r);
    $('#epMake').onclick=async()=>{
      const n=parseInt($('#epNum').value,10);
      if(!n||n<1||n>2000){toast('1〜2000 の数字を入れてください');return;}
      w.episodes=makeNumberedEpisodes(n); selKey=null;
      await saveWorks(); paintEpisodes(); toast(n+'話ぶんの枠を作りました');};
  }
  async function importEpisodes(btn,hint){
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> 取り込んでいます…';
    try{
      const [kind,sid]=w.source.split(':');
      if(kind==='tmdb'){
        if(!settings.tmdbKey) throw new Error('nokey');
        const {episodes}=await fetchEpisodesTMDB(sid);
        if(!episodes.length) throw new Error('empty');
        w.episodes=episodes;
      }else{
        const n=await fetchEpisodeCountAniList(sid);
        if(!n) throw new Error('empty');
        w.episodes=makeNumberedEpisodes(n);
      }
      selKey=null; await saveWorks(); paintEpisodes();
      toast(w.episodes.length+'話ぶん取り込みました');
    }catch(e){
      btn.disabled=false; btn.textContent='話数を取り込む';
      hint.textContent = e.message==='nokey' ? 'TMDB のキーが未設定です。⚙ から登録してください。'
        : e.message==='empty' ? '話数の情報が見つかりませんでした。下の欄から手で作れます。'
        : '取り込みに失敗しました。通信を確認してください。';
      const a=$('#epArea'); addManualCount(a);
    }
  }

  const flagText={want:'これから',watching:'見てる',done:'見た',paused:'中断',dropped:'やめた'};
  const paintFlag=()=>{const f=$('#dFlag'); f.className='flag '+w.status; f.textContent=flagText[w.status];};
  const paintRate=()=>{
    [...$('#rate').children].forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===w.rating));
    $('#rateNote').textContent = w.rating? '★'.repeat(w.rating)+'　'+RATE[w.rating] : 'まだ評価していません';};
  const refresh=()=>{
    const box=$('#logs');
    const ls=[...(w.logs||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    box.innerHTML = ls.length? '' : '<div class="hint">まだ記録はありません。</div>';
    ls.forEach(l=>{
      const d=el('div','log');
      d.innerHTML=`<div class="d">${esc(l.date||'')}${l.ep?' 　'+esc(l.ep):''}</div>
        <div class="b">${esc(l.body)}</div><button class="del">削除</button>`;
      d.querySelector('.del').onclick=async()=>{
        w.logs=w.logs.filter(x=>x.id!==l.id); w.updatedAt=Date.now();
        await saveWorks(); refresh(); paintEpisodes(); render();};
      box.appendChild(d);});
    const tot=(w.episodes||[]).length;
    $('#cnt').textContent = (w.review?'総評あり':'総評なし') + ' 　記録 '+ls.length+'件'+(tot?' / 全'+tot+'話':'');
    $('#rvMeta').textContent = w.reviewAt ? ('最後に書いたのは '+w.reviewAt) : 'まだ書いていません';
  };
  paintFlag(); paintRate(); refresh(); paintEpisodes();

  $('#stSeg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.status=b.dataset.s; w.updatedAt=Date.now();
    [...$('#stSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
    paintFlag(); await saveWorks(); render(); toast(STAT[w.status]);};

  $('#catSeg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.cat=b.dataset.c; w.updatedAt=Date.now();
    [...$('#catSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#sheetTitle').textContent=CATS[w.cat];
    await saveWorks(); paintEpisodes(); render(); toast(CATS[w.cat]+'にしました');};

  $('#rate').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.rating=+b.dataset.v; w.updatedAt=Date.now(); paintRate(); await saveWorks(); render();};

  $('#rvSave').onclick=async()=>{
    const v=$('#rvBody').value.trim();
    if(v===(w.review||'')){toast('変更はありません');return;}
    w.review=v; w.reviewAt=today(); w.updatedAt=Date.now();
    await saveWorks(); refresh(); render();
    toast(v?'総評を保存しました':'総評を空にしました');};

  $('#lgSave').onclick=async()=>{
    const body=$('#lgBody').value.trim(), ep=$('#lgEp').value.trim();
    if(!body&&!ep){toast('ひとことでも書いてみてください');return;}
    w.logs=[...(w.logs||[]),{id:uid(),date:$('#lgDate').value||today(),ep,epKey:selKey||'',body}];
    w.updatedAt=Date.now();
    if(w.status==='want'){w.status='watching';
      [...$('#stSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='watching'));paintFlag();}
    $('#lgBody').value='';
    // 記録できたら自動で次の話へ進める
    const eps=w.episodes||[];
    if(eps.length){
      const seen=new Set((w.logs||[]).map(l=>l.epKey).filter(Boolean));
      const next=eps.find(e=>!seen.has(e.k));
      selKey = next? next.k : null;
      if(!next && w.status!=='done'){
        w.status='done';
        [...$('#stSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='done'));
        paintFlag(); toast('最終話まで記録。「見た」にしました');
      }
    }else{$('#lgEp').value='';}
    await saveWorks(); refresh(); paintEpisodes(); render();
    if(eps.length && selKey) toast('記録しました');
    else if(!eps.length) toast('記録しました');};

  const syn=$('#syn'); if(syn) $('#synMore').onclick=e=>{syn.classList.toggle('open');
    e.target.textContent=syn.classList.contains('open')?'閉じる':'続きを読む';};

  // 二段階削除（confirm はこの環境で効かないため）
  let armed=false, armT;
  const delBtn=$('#del');
  delBtn.onclick=async()=>{
    if(!armed){
      armed=true; delBtn.classList.add('armed');
      delBtn.textContent='もう一度押すと削除します';
      $('#delHint').textContent='記録 '+(w.logs?.length||0)+'件ごと消えます。4秒待つと取り消されます。';
      armT=setTimeout(()=>{armed=false;delBtn.classList.remove('armed');
        delBtn.textContent='この作品を書庫から外す';$('#delHint').textContent='';},4000);
      return;
    }
    clearTimeout(armT);
    works=works.filter(x=>x.id!==w.id);
    await saveWorks();
    await sdel('shoko:img:'+w.id);
    imgCache.delete(w.id);
    closeSheet(); render(); toast('「'+w.title+'」を書庫から外しました');};
}

/* ---------- settings ---------- */
function openSettings(){
  openSheet('設定',`
    <label class="f" style="margin-top:0">TMDB API キー</label>
    <input class="in" id="tk" value="${esc(settings.tmdbKey)}" placeholder="映画・ドラマ検索に必要">
    <div class="hint">themoviedb.org で無料アカウントを作り、設定 → API から取得できます。
      アニメ検索と手動登録はキー無しで使えます。</div>
    <div style="height:14px"></div><button class="btn" id="tkSave">キーを保存</button>
    <div style="height:8px"></div><button class="btn ghost" id="diag">接続を確認する</button>
    <div id="diagOut"></div>
    <div class="divider"></div>
    <label class="f" style="margin-top:0">持ち出しと引き継ぎ</label>
    <div class="hint">10年後もこの記録が読めるかどうかは、この機能にかかっています。ときどき書き出してください。</div>
    <div style="height:10px"></div>
    <button class="btn ghost" id="exp">JSON で書き出す（${works.length}件）</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="impBtn">JSON から読み込む</button>
    <input type="file" id="imp" accept="application/json" style="display:none">
    <div class="hint">書き出しには手で入れた表紙画像も含まれます。読み込みは既存データに追加されます。</div>
    <div class="divider"></div>
    <label class="f" style="margin-top:0">このアプリについて</label>
    <div class="hint" style="margin-top:0">書庫 v${VERSION}（データ構造 v${SCHEMA}）</div>
    <div style="height:10px"></div>
    ${CHANGES.map(([v,t])=>`<div style="display:flex;gap:10px;font-size:11.5px;color:#6C7686;
      line-height:1.7;padding:3px 0"><span style="color:var(--brass-dim);flex:0 0 42px;
      font-family:var(--mincho)">${v}</span><span>${esc(t)}</span></div>`).join('')}`);
  $('#tkSave').onclick=async()=>{settings.tmdbKey=$('#tk').value.trim();await saveSettings();
    toast(settings.tmdbKey?'キーを保存しました':'キーを空にしました');};

  $('#diag').onclick=async()=>{
    const out=$('#diagOut');
    out.innerHTML='<div class="hint"><span class="spin"></span> 確認しています…</div>';
    const lines=[];
    // AniList（認証不要）
    try{
      const t0=Date.now();
      const r=await fetch('https://graphql.anilist.co',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:'{Media(id:1,type:ANIME){id}}'})});
      lines.push([r.ok,'AniList', r.ok? '応答あり（'+(Date.now()-t0)+'ms）' : 'HTTP '+r.status]);
    }catch(e){ lines.push([false,'AniList','届きません — '+(e.message||'原因不明')]); }
    // TMDB（キー必要）
    if(!settings.tmdbKey){ lines.push([false,'TMDB','キーが未設定です']); }
    else{
      try{
        const t0=Date.now();
        const r=await fetch('https://api.themoviedb.org/3/configuration?api_key='
          +encodeURIComponent(settings.tmdbKey));
        lines.push([r.ok,'TMDB', r.ok? 'キー有効（'+(Date.now()-t0)+'ms）'
          : (r.status===401? 'キーが無効です（401）' : 'HTTP '+r.status)]);
      }catch(e){ lines.push([false,'TMDB','届きません — '+(e.message||'原因不明')]); }
    }
    const allDown = lines.every(l=>!l[0]);
    out.innerHTML = lines.map(([ok,name,msg])=>
      `<div style="display:flex;gap:9px;font-size:12px;padding:4px 0;line-height:1.6">
        <span style="flex:0 0 14px;color:${ok?'var(--jade)':'var(--seal)'}">${ok?'✓':'✕'}</span>
        <span style="flex:0 0 58px;color:var(--paper-dim)">${name}</span>
        <span style="color:${ok?'var(--paper)':'var(--seal)'}">${esc(msg)}</span></div>`).join('')
      + (allDown? '<div class="hint">両方とも届いていません。このプレビュー画面が外部通信を止めている可能性が高く、その場合は自分のサーバや GitHub Pages に置けば直ります。</div>'
         : '<div class="hint">✓ が付いた側は使えます。</div>');
  };
  $('#exp').onclick=async()=>{
    const out=[];
    for(const w of works){const c={...w}; if(w.cover?.startsWith('local:')) c.imageData=await resolveCover(w); out.push(c);}
    const blob=new Blob([JSON.stringify({app:'shoko',appVersion:VERSION,schema:SCHEMA,
      exportedAt:new Date().toISOString(),count:out.length,works:out},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='shoko-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
    settings.lastExport=Date.now(); settings.backupHiddenUntil=0;
    await saveSettings(); paintBackupBar(); toast('書き出しました');};
  $('#impBtn').onclick=()=>$('#imp').click();
  $('#imp').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{
      const d=JSON.parse(await f.text()); const arr=Array.isArray(d)?d:d.works;
      if(!Array.isArray(arr)) throw new Error();
      for(const w of arr){const id=uid();
        if(w.imageData){await sset('shoko:img:'+id,w.imageData);imgCache.set(id,w.imageData);w.cover='local:'+id;}
        delete w.imageData;
        works.push({...w,id,logs:w.logs||[],review:w.review||'',episodes:w.episodes||[],updatedAt:w.updatedAt||Date.now()});}
      await saveWorks(); closeSheet(); render(); toast(arr.length+'件を読み込みました');
    }catch(err){toast('このファイルは読み込めませんでした');}};
}

/* ---------- wiring ---------- */
$('#fab').onclick=openAdd;
$('#setBtn').onclick=openSettings;
$('#safeBtn').onclick=async()=>{settings.safe=!settings.safe;
  $('#safeBtn').classList.toggle('on',settings.safe); await saveSettings(); render();
  toast(settings.safe?'伏せ字表示：オン':'伏せ字表示：オフ');};
$('#q').oninput=e=>{filter.q=e.target.value;render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ---------- PWA / Android まわり ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
// ストレージを消されにくくする
if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});

// 共有メニューから来たときはタイトルを拾って検索を開く
function handleShare(){
  const p=new URLSearchParams(location.search);
  const t=(p.get('title')||p.get('text')||'').trim();
  if(!t) return;
  history.replaceState(null,'',location.pathname);
  openAdd();
  const q=t.slice(0,80);
  setTimeout(()=>{const i=$('#apiq'); if(i){i.value=q; i.dispatchEvent(new Event('input'));}},60);
}

// 書き出しから日が空いたら知らせる
function paintBackupBar(){
  const bar=$('#backupBar'); bar.innerHTML='';
  if(!works.length || settings.backupHiddenUntil>Date.now()) return;
  const last=settings.lastExport||0;
  const days=last? Math.floor((Date.now()-last)/86400000) : null;
  if(last && days<30) return;
  const d=el('div','backupbar');
  d.innerHTML=`<span style="flex:1">${last? '最後の書き出しから'+days+'日たちました。'
    : 'まだ一度も書き出していません。'}端末を替えると記録は消えます。</span>
    <button id="bkNow">書き出す</button><button class="x" id="bkLater">後で</button>`;
  bar.appendChild(d);
  $('#bkNow').onclick=()=>{openSettings();setTimeout(()=>$('#exp')?.click(),120);};
  $('#bkLater').onclick=async()=>{settings.backupHiddenUntil=Date.now()+7*86400000;
    await saveSettings(); paintBackupBar();};
}

(async()=>{
  $('#verLabel').textContent='v'+VERSION;
  works=(await sget(KW))||[];
  // 旧データの移行：タグを廃止し、総評フィールドを用意する
  let migrated=false;
  works.forEach(w=>{
    if(w.review===undefined){w.review='';migrated=true;}
    if(w.tags!==undefined){delete w.tags;migrated=true;}
    if(w.episodes===undefined){w.episodes=[];migrated=true;}
  });
  if(migrated) await saveWorks();
  settings=Object.assign(settings,(await sget(KS))||{});
  $('#safeBtn').classList.toggle('on',settings.safe);
  render();
  paintBackupBar();
  handleShare();
})();
})();
</script>
