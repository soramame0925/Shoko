<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoko — 書庫</title>
<meta name="description" content="観た映画・ドラマ・アニメを記録する、自分だけの書庫。">
<meta name="theme-color" content="#121822">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --ink:#121822; --ink-deep:#0C1017; --panel:#1A222E; --panel-2:#222C3A; --line:#2E3948;
    --paper:#E9E3D5; --paper-dim:#9BA3AF; --brass:#C8A45D; --brass-dim:#8A7440;
    --jade:#4F8A6E; --seal:#B5503C; --slate:#606B7C;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP","Helvetica Neue",sans-serif;
    --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--gothic);
       font-size:15px;line-height:1.6;padding-bottom:100px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:20;background:var(--ink);padding:14px 0 6px;
         border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0;letter-spacing:.24em}
  .brand small{font-size:10px;letter-spacing:.18em;color:var(--brass-dim);font-family:var(--mincho)}
  .brand .sp{flex:1}
  .icobtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
          color:var(--paper-dim);font-size:15px;border:1px solid transparent}
  .icobtn.on{color:var(--brass);border-color:var(--brass-dim)}

  .searchbar{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--panel);
             border:1px solid var(--line);border-radius:var(--r);padding:7px 11px}
  .searchbar input{background:none;border:none;outline:none;width:100%;font-size:14px}
  .searchbar input::placeholder{color:#5D6675}

  /* 状態タブ：一番上、いちばん目立つ場所に */
  /* 状態タブ：大きめ・押しやすく */
  .statbar{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
  .statbar::-webkit-scrollbar{display:none}
  .statbar button{flex:0 0 auto;padding:11px 16px;border-radius:var(--r);font-size:14px;
                  color:var(--paper-dim);border:1px solid var(--line);display:flex;gap:7px;align-items:baseline;
                  min-height:44px;line-height:1.2}
  .statbar button b{font-weight:400;font-size:11.5px;opacity:.65}
  .statbar button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-color:transparent}
  .statbar button[aria-pressed="true"] b{opacity:.75}
  .statbar button[data-s="all"][aria-pressed="true"]{background:var(--paper)}
  .statbar button[data-s="want"][aria-pressed="true"]{background:var(--slate);color:var(--paper)}
  .statbar button[data-s="watching"][aria-pressed="true"]{background:var(--brass)}
  .statbar button[data-s="done"][aria-pressed="true"]{background:var(--jade);color:#0C1017}
  .statbar button[data-s="paused"][aria-pressed="true"]{background:var(--panel-2);color:var(--paper)}
  .statbar button[data-s="dropped"][aria-pressed="true"]{background:var(--seal);color:var(--paper)}

  .catbar{display:flex;gap:4px;align-items:center;padding:10px 0 9px}
  .catbar button{flex:0 0 auto;font-size:14px;color:#5D6675;padding:9px 12px;min-height:44px;
                 border-bottom:2px solid transparent;border-radius:2px}
  .catbar button[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--brass)}
  .catbar button.apart{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px}
  .catbar button.apart[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(200,164,93,.09)}

  .recall{margin:12px 0 2px;border:1px solid var(--line);border-left:2px solid var(--brass);
          background:var(--panel);border-radius:var(--r);padding:11px 12px;display:flex;gap:11px;align-items:center;width:100%}
  .recall .eyebrow{font-family:var(--mincho);font-size:10px;letter-spacing:.2em;color:var(--brass);display:block;margin-bottom:3px}
  .recall .t{font-family:var(--mincho);font-size:15px;line-height:1.35}
  .recall .m{font-size:11px;color:var(--paper-dim);margin-top:3px}
  .recall img{width:42px;height:61px;object-fit:cover;border-radius:2px;flex:0 0 auto;background:var(--panel-2)}
  .recall .body{flex:1;min-width:0;text-align:left}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
  /* 同人の棚：横長の表紙が多いので枠ごと横に。1行2列で大きく見せる */
  .grid.wide{grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:520px){.grid.wide{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:700px){.grid.wide{grid-template-columns:repeat(4,1fr)}}
  .grid.wide .cover{aspect-ratio:4/3}

  /* 表紙は隠さない。状態は明るさと下端の線で示す */
  .cover{position:relative;aspect-ratio:2/3;background:var(--panel-2);border-radius:2px;
         overflow:hidden;border:1px solid var(--line);display:block;width:100%}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s;position:relative;z-index:1}
  /* 縦長でない表紙は切り抜かず、背景に同じ絵をぼかして敷く */
  .cover.fit-contain img{object-fit:contain}
  .cover .fill{position:absolute;inset:-12%;background-size:cover;background-position:center;
               filter:blur(16px) saturate(.75) brightness(.5);z-index:0}
  .cover.blur img{filter:blur(13px) saturate(.5)}
  .cover .noimg{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:8px;
                font-family:var(--mincho);font-size:11.5px;color:#8A93A1;text-align:center;line-height:1.5}
  .cover::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--slate);z-index:3}
  .cover.st-watching::after{background:var(--brass)}
  .cover.st-done::after{background:var(--jade)}
  .cover.st-paused::after{background:repeating-linear-gradient(90deg,var(--slate) 0 5px,transparent 5px 10px)}
  .cover.st-dropped::after{background:var(--seal)}
  /* 未視聴は沈ませる。観たものだけが色を持つ */
  .cover.st-want img{filter:brightness(.42) saturate(.55)}
  .cover.st-paused img{filter:brightness(.55) saturate(.7)}
  .cover.st-dropped img{filter:grayscale(1) brightness(.38)}
  .cover.st-want.blur img,.cover.st-paused.blur img,.cover.st-dropped.blur img{filter:blur(13px) brightness(.45) saturate(.5)}
  .rbadge{position:absolute;top:0;left:0;z-index:4;background:linear-gradient(135deg,rgba(12,16,23,.9) 55%,transparent 55%);
          color:var(--brass);font-size:11px;padding:3px 12px 8px 5px;letter-spacing:.02em;line-height:1;font-weight:700}

  .empty{margin-top:56px;text-align:center;color:var(--paper-dim)}
  .empty .k{font-family:var(--mincho);font-size:34px;color:#2E3948;letter-spacing:.3em}
  .empty p{font-size:13px;margin:14px 0 0}

  .fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
       width:54px;height:54px;border-radius:50%;background:var(--brass);color:var(--ink-deep);
       font-size:26px;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.5);font-weight:300}

  .scrim{position:fixed;inset:0;background:rgba(6,9,13,.72);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;
         background:var(--ink-deep);border-top:1px solid var(--line);border-radius:12px 12px 0 0;
         transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
         padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:var(--ink-deep);padding:14px 0 10px;z-index:2;
              display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-family:var(--mincho);font-size:15px;letter-spacing:.14em;margin:0;flex:1;font-weight:600}
  .sheet-body{padding-top:14px;max-width:760px;margin:0 auto}
  @media(min-width:760px){.sheet{border-radius:12px;left:50%;transform:translate(-50%,100%);width:720px}
                          .sheet.open{transform:translate(-50%,0)}}

  label.f{display:block;font-size:11px;letter-spacing:.12em;color:var(--brass-dim);
          font-family:var(--mincho);margin:18px 0 7px}
  .in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:9px 11px;outline:none;font-size:14px}
  .in:focus{border-color:var(--brass-dim)}
  textarea.in{min-height:96px;resize:vertical;line-height:1.7}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{background:var(--brass);color:var(--ink-deep);font-weight:700;border-radius:var(--r);
       padding:11px;width:100%;font-size:14px;letter-spacing:.06em}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--paper);font-weight:400}
  .btn.danger{background:none;border:1px solid var(--seal);color:var(--seal);font-weight:400}
  .btn.danger.armed{background:var(--seal);color:#fff;font-weight:700}
  .seg{display:flex;gap:5px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;font-size:13px;color:var(--paper-dim)}
  .seg button[aria-pressed="true"]{background:var(--panel-2);border-color:var(--brass-dim);color:var(--brass);font-weight:700}

  /* 状態選択：詳細画面の最上部、色つきで大きく */
  .statpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .statpick button{border:1px solid var(--line);border-radius:var(--r);padding:10px 4px;font-size:13px;color:var(--paper-dim)}
  .statpick button[data-s="want"][aria-pressed="true"]{background:var(--slate);color:var(--paper);border-color:var(--slate);font-weight:700}
  .statpick button[data-s="watching"][aria-pressed="true"]{background:var(--brass);color:var(--ink-deep);border-color:var(--brass);font-weight:700}
  .statpick button[data-s="done"][aria-pressed="true"]{background:var(--jade);color:var(--ink-deep);border-color:var(--jade);font-weight:700}
  .statpick button[data-s="paused"][aria-pressed="true"]{background:var(--panel-2);color:var(--paper);border-color:#485468;font-weight:700}
  .statpick button[data-s="dropped"][aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal);font-weight:700}

  .rate{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .rate button{border:1px solid var(--line);border-radius:var(--r);padding:9px 2px;font-size:13px;color:var(--paper-dim)}
  .rate button[aria-pressed="true"]{background:var(--brass);color:var(--ink-deep);border-color:var(--brass);font-weight:700}
  .rateNote{font-size:12px;color:var(--paper-dim);margin-top:7px;min-height:1.5em}

  .res{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:center}
  .res img{width:42px;height:62px;object-fit:cover;border-radius:2px;background:var(--panel-2);flex:0 0 auto}
  .res .t{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .res .m{font-size:11px;color:#6C7686;margin-top:2px}
  .res .add{color:var(--brass);font-size:20px;flex:0 0 auto;padding:0 4px}

  .dhead{display:flex;gap:14px;align-items:flex-start}
  .dhead .cv{width:88px;flex:0 0 auto}
  .dhead .cv.wide{width:128px}
  .dhead .cv.wide .cover{aspect-ratio:4/3}
  .dhead h3{font-family:var(--mincho);font-size:18px;line-height:1.45;margin:0 0 6px;font-weight:600}
  .meta{font-size:11.5px;color:var(--paper-dim);letter-spacing:.04em}
  .syn{font-size:12.5px;color:var(--paper-dim);line-height:1.75;margin-top:12px;max-height:5.3em;overflow:hidden}
  .syn.open{max-height:none}
  .more{font-size:11px;color:var(--brass);margin-top:3px}

  .mcover{aspect-ratio:2/3;max-width:120px;margin:0 0 14px;border:1px solid var(--line);
          border-radius:2px;background:var(--panel);position:relative;overflow:hidden;
          display:grid;place-items:center}
  .mcover img{width:100%;height:100%;object-fit:cover}
  .mcover span{position:absolute;bottom:0;left:0;right:0;background:rgba(12,16,23,.85);
               font-size:10px;color:var(--paper-dim);text-align:center;padding:3px}
  .mcover>span:only-child{position:static;background:none;font-size:11px}
  .blrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .blrow img{width:52px;height:52px;object-fit:cover;border-radius:2px;background:var(--panel-2);flex:0 0 auto}
  .blrow .body{flex:1;min-width:0}
  .blrow .fn{font-size:10px;color:#5A6472;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .blrow .x{flex:0 0 30px;color:#5D6675;font-size:15px}
  .logbar{display:flex;gap:5px;align-items:center;margin-bottom:12px}
  .logbar button{border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;
                 font-size:11.5px;color:var(--paper-dim);white-space:nowrap}
  .logbar button[aria-pressed="true"]{border-color:var(--brass-dim);color:var(--brass)}
  .log.cur{border-left-color:var(--brass)}
  .log.cur::before{background:var(--brass)}
  .log{border-left:2px solid var(--line);padding:0 0 16px 13px;position:relative;margin-left:3px}
  .log:last-child{padding-bottom:2px}
  .log::before{content:"";position:absolute;left:-4.5px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--brass-dim)}
  .log .d{font-size:11px;color:var(--brass-dim);letter-spacing:.1em;font-family:var(--mincho)}
  .log .b{font-size:13.5px;line-height:1.8;white-space:pre-wrap;margin-top:3px}
  .log .del{font-size:11px;color:#5D6675;margin-top:4px}

  .prog{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin:9px 0 4px}
  .prog i{display:block;height:100%;background:var(--brass);transition:width .25s}
  .eps{display:flex;gap:5px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .eps::-webkit-scrollbar{display:none}
  .eps button{flex:0 0 auto;min-width:38px;padding:7px 8px;border:1px solid var(--line);
              border-radius:var(--r);font-size:12.5px;color:var(--paper-dim);position:relative}
  .eps button.seen{border-color:var(--jade);color:var(--jade)}
  .eps button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);
              color:var(--ink-deep);font-weight:700}
  .eptitle{font-size:12px;color:var(--paper);background:var(--panel);border:1px solid var(--line);
           border-radius:var(--r);padding:7px 10px;line-height:1.5;margin-bottom:8px}
  .eptitle b{color:var(--brass);font-weight:400;font-family:var(--mincho);margin-right:7px}
  .sectitle{font-family:var(--mincho);font-size:15px;letter-spacing:.1em;margin:0 0 10px;
            display:flex;align-items:baseline;gap:9px;border-left:2px solid var(--brass);padding-left:9px}
  .sectitle span{font-family:var(--gothic);font-size:10.5px;letter-spacing:0;color:#6C7686;font-weight:400}
  .hint{font-size:11.5px;color:#6C7686;line-height:1.7;margin-top:7px}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .backupbar{background:var(--panel-2);border-bottom:1px solid var(--brass-dim);
             padding:9px 14px;font-size:12px;color:var(--paper);display:flex;gap:10px;align-items:center}
  .backupbar button{color:var(--brass);font-size:12px;text-decoration:underline;flex:0 0 auto}
  .backupbar .x{color:#5D6675;text-decoration:none}
  footer{max-width:760px;margin:34px auto 0;padding:18px 14px 0;border-top:1px solid var(--line);
         font-size:10.5px;color:#5A6472;line-height:1.8}
  footer a{color:#6C7686}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
         background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--paper);
         padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
        border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="backupBar"></div>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>書庫</h1><small id="verLabel"></small>
      <span class="sp"></span>
      <button class="icobtn" id="safeBtn" title="伏せ字表示">◐</button>
      <button class="icobtn" id="setBtn" title="設定">⚙</button>
    </div>
    <div class="searchbar"><span style="color:#5D6675">検索</span>
      <input id="q" placeholder="棚の中を探す" autocomplete="off"></div>
    <div class="statbar" id="statbar"></div>
    <div class="catbar" id="catbar"></div>
  </div>
</header>

<main class="wrap">
  <div id="recall"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="k">空</div><p>まだ何も収めていません。<br>右下の ＋ から一本目を。</p>
  </div>
</main>

<button class="fab" id="fab" aria-label="作品を追加">＋</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2>
  <button class="icobtn" id="closeSheet">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<footer class="wrap">
  <div>Shoko — 記録はこの端末の中だけに保存されます。</div>
  <div style="margin-top:6px">This product uses the TMDB API but is not endorsed or certified by TMDB.
    アニメ情報の一部は AniList のデータを利用しています。</div>
</footer>

<script>
(()=>{
"use strict";
const VERSION='2.0.0';   // 表示用
const SCHEMA=3;          // データ構造の版。移行判定に使う
const CHANGES=[
  ['2.0.0','画像をまとめて読み込んで一括登録できるように。ファイル名からタイトルを起こし、既存作品への自動割り当てにも対応。'],
  ['1.9.0','同人の棚を横長の枠に変更。1行2列で大きく表示。'],
  ['1.8.1','評価と状態の線が表紙の下に隠れていた不具合を修正。'],
  ['1.8.0','横長や正方形の表紙を切り抜かずに収めるように。見せ方の手動指定を追加。'],
  ['1.7.0','スクショの貼り付けと、共有メニューからの画像受け取りに対応。表紙をあとから変えられるように。話数バッジを廃止。'],
  ['1.6.0','取り込み時に作品番号から表紙を探せるように。表紙のない作品を順に片付ける画面を追加。'],
  ['1.5.0','同人を独立したタブに分離。表紙を隠さない表示に変更。タブを大きく。DLsite の作品番号から表紙を探せるように。'],
  ['1.4.0','記録を話数順に並べ替え。選んだ話の記録だけを表示できるように。'],
  ['1.3.0','まとめて削除を追加。直前の取り込みの取り消し、絞り込み範囲の削除、全削除。'],
  ['1.2.0','SakuLog の書き出しを自動判別して、表紙・総評・話数メモごと取り込めるように。'],
  ['1.1.0','ほかのアプリの JSON / CSV を、列を対応づけて取り込めるように。'],

/* ---------- 保存層：IndexedDB（この端末の中だけ） ---------- */
const DB_NAME='shoko-db', STORE='kv';
let dbPromise=null, memFallback=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('IndexedDB がありません'));
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error||new Error('IndexedDB を開けません'));
  }).catch(e=>{ memFallback=new Map(); throw e; });
  return dbPromise;
}
function tx(mode){ return openDB().then(d=>d.transaction(STORE,mode).objectStore(STORE)); }
async function sget(k){
  if(memFallback) return memFallback.has(k)? memFallback.get(k) : null;
  try{
    const st=await tx('readonly');
    return await new Promise((res,rej)=>{ const q=st.get(k);
      q.onsuccess=()=>res(q.result===undefined?null:q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ if(!memFallback) memFallback=new Map(); return memFallback.get(k)??null; }
}
async function sset(k,v){
  if(memFallback){ memFallback.set(k,v); return false; }
  try{
    const st=await tx('readwrite');
    await new Promise((res,rej)=>{ const q=st.put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
    return true;
  }catch(e){
    if(!memFallback) memFallback=new Map();
    memFallback.set(k,v);
    toast('保存できませんでした（プライベートモードの可能性）');
    return false;
  }
}
async function sdel(k){
  if(memFallback){ memFallback.delete(k); return; }
  try{ const st=await tx('readwrite');
    await new Promise((res,rej)=>{ const q=st.delete(k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}

async function resolveCover(w){
  if(!w.cover) return '';
  if(!w.cover.startsWith('local:')) return w.cover;
  if(imgCache.has(w.id)) return imgCache.get(w.id);
  const d=(await sget('shoko:img:'+w.id))||''; imgCache.set(w.id,d); return d;
}

// 縦長かどうかで表紙の見せ方を変える。w.fit で手動指定もできる。
function applyFit(box,im,src,w,frame){
  const decide=()=>{
    const nat = im.naturalWidth&&im.naturalHeight ? im.naturalWidth/im.naturalHeight : 0.667;
    // 枠の形に近ければ切り抜き、離れていれば全体を見せる
    const target = frame==='wide' ? 4/3 : 2/3;
    const off = nat>target ? nat/target : target/nat;
    const fit = w.fit && w.fit!=='auto' ? w.fit : (off>1.22 ? 'contain' : 'cover');
    box.classList.toggle('fit-contain', fit==='contain');
    if(fit==='contain' && !box.querySelector('.fill')){
      const bg=el('div','fill');
      bg.style.backgroundImage='url("'+String(src).replace(/"/g,'%22')+'")';
      box.insertBefore(bg, box.firstChild);
    }
  };
  if(im.complete && im.naturalWidth) decide(); else im.addEventListener('load',decide,{once:true});
}

async function renderRecall(){
  const box=$('#recall'); box.innerHTML='';
  if(works.length<3) return;
  const md=today().slice(5), yr=new Date().getFullYear();
  const pool0=works.filter(w=>inScope(w,filter.cat));
  if(pool0.length<3) return;
  let pick=null,note='';
  for(const w of pool0) for(const l of (w.logs||[])){
    if(l.date && l.date.slice(5)===md && +l.date.slice(0,4)<yr){
      pick=w; note=(yr-+l.date.slice(0,4))+'年前の今日、記録しています'; break;}}
  if(!pick){
    const pool=pool0.filter(w=>w.status==='done'); if(!pool.length) return;
    pick=pool[+today().replace(/-/g,'')%pool.length];
    const last=[...(pick.logs||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    note=last?.date?('最後の記録は '+last.date):'記録はまだありません';}
  const card=el('button','recall');
  const src=await resolveCover(pick);
  if(src){const im=el('img');im.src=src;im.alt='';if(settings.safe&&pick.adult)im.style.filter='blur(8px)';card.appendChild(im);}
  const body=el('div','body');
  body.innerHTML='<span class="eyebrow">掘り起こし</span><div class="t">'+esc(pick.title)+'</div><div class="m">'+esc(note)+'</div>';
  card.appendChild(body); card.onclick=()=>openDetail(pick.id); box.appendChild(card);
}

async function runSearch(kind,q){

      // アニメは AniList を先に試し、届かなければ TMDB に切り替える

      if(!items.length){
        if(settings.tmdbKey){
          items=await tmdbSearch(q,'anime');

                         : 'AniList に無かったため、TMDB の結果です。';

  }catch(e){

      <div style="height:10px"></div>

    $('#toManual').onclick=()=>{
      [...$('#srcSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='manual'));

async function tmdbSearch(q,forceCat){
  const u='https://api.themoviedb.org/3/search/multi?language=ja-JP&include_adult=false&query='
    +encodeURIComponent(q)+'&api_key='+encodeURIComponent(settings.tmdbKey);
  const res=await fetch(u); if(!res.ok) throw new Error('TMDB への接続に失敗しました（キーを確認してください）');
  const d=await res.json();
  return (d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').map(x=>({
    title:x.title||x.name, cat: forceCat || (x.media_type==='movie'?'movie':'drama'),
    year:(x.release_date||x.first_air_date||'').slice(0,4),
    cover:x.poster_path?'https://image.tmdb.org/t/p/w342'+x.poster_path:'',
    synopsis:x.overview||'', source:'tmdb:'+x.id}));
}
async function anilistSearch(q){
  const query=`query($q:String){Page(perPage:15){media(search:$q,type:ANIME){id startDate{year}
    title{native romaji} coverImage{large} description(asHtml:false)}}}`;
  const res=await fetch('https://graphql.anilist.co',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{q}})});
  if(!res.ok) throw new Error('AniList が応答しませんでした（'+res.status+'）');
  const d=await res.json();
  return (d.data?.Page?.media||[]).map(m=>({
    title:m.title.native||m.title.romaji, cat:'anime', year:m.startDate?.year||'',
    cover:m.coverImage?.large||'', synopsis:(m.description||'').replace(/<[^>]+>/g,''),
    source:'anilist:'+m.id}));
}

function dlsiteCovers(code){
  const m=/^\s*([A-Za-z]{2})?0*(\d+)\s*$/.exec(String(code||''));
  if(!m) return [];
  const pre=(m[1]||'RJ').toUpperCase(), n=parseInt(m[2],10);
  if(!isFinite(n)||n<=0) return [];
  const wide = m[2].replace(/^0+/,'').length>6 || n>=1000000;
  const pad = v=>String(v).padStart(wide?8:6,'0');
  const id=pre+pad(n), dir=pre+pad(Math.ceil((n+1)/1000)*1000);
  const cat = /^(RJ|RE)$/.test(pre)? 'doujin' : 'professional';
  const base=`https://img.dlsite.jp/modpub/images2/work/${cat}/${dir}`;
  return [`${base}/${id}_img_main.jpg`,
          `${base}/${id}_img_main.webp`,
          `https://img.dlsite.jp/resize/images2/work/${cat}/${dir}/${id}_img_main_240x240.jpg`];
}
// 候補を順に読み込んでみて、最初に表示できたものを返す
function firstLoadable(urls){
  return new Promise(res=>{
    let i=0;
    const tryNext=()=>{
      if(i>=urls.length) return res('');
      const u=urls[i++], im=new Image();
      im.referrerPolicy='no-referrer';
      im.onload=()=>im.naturalWidth>1? res(u) : tryNext();
      im.onerror=tryNext;
      im.src=u;
    };
    tryNext();
  });
}

// onChange(url, dataUrl) が呼ばれる。どちらか一方が入る。
function bindCoverPicker(pfx,onChange){
  const prev=$('#'+pfx+'Prev');
  const show=(src,label)=>{
    prev.innerHTML = src? `<img src="${esc(src)}" referrerpolicy="no-referrer" alt=""><span>${esc(label)}</span>`
                        : '<span>まだ何も</span>';
  };
  const setUrl =u=>{ show(u,'URL から'); onChange(u,''); };
  const setData=(d,l)=>{ show(d,l||'端末内に保存'); onChange('',d); };
  const busy=m=>{ prev.innerHTML='<span><span class="spin"></span> '+m+'</span>'; };

  $('#'+pfx+'Pick').onclick=()=>$('#'+pfx+'File').click();
  $('#'+pfx+'File').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    busy('読み込んでいます…'); setData(await shrink(f));};

  $('#'+pfx+'Paste').onclick=async()=>{
    try{
      if(!navigator.clipboard?.read) throw new Error('この端末では貼り付けに対応していません');
      busy('クリップボードを見ています…');
      const items=await navigator.clipboard.read();
      for(const it of items){
        const type=it.types.find(t=>t.startsWith('image/'));
        if(type){ const blob=await it.getType(type); setData(await shrink(blob),'貼り付けから'); return; }
      }
      show('',''); toast('画像が見つかりませんでした');
    }catch(err){ show('',''); toast(err.message||'貼り付けできませんでした'); }
  };
  // キーボードや長押しからの貼り付けも拾う
  const onPaste=async e=>{
    const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));
    if(!it) return;
    e.preventDefault(); busy('読み込んでいます…');
    setData(await shrink(it.getAsFile()),'貼り付けから');
  };
  document.addEventListener('paste',onPaste);
  sheetCleanup=()=>document.removeEventListener('paste',onPaste);

  $('#'+pfx+'RjGo').onclick=async()=>{
    const c=dlsiteCovers($('#'+pfx+'Rj').value);
    if(!c.length){toast('RJ番号を入れてください');return;}
    busy('探しています…');
    const hit=await firstLoadable(c);
    if(hit) show(hit,'DLsite から'),onChange(hit,'');
    else{ show('',''); toast('見つかりませんでした'); }
  };
  $('#'+pfx+'UrlGo').onclick=async()=>{
    const u=$('#'+pfx+'Url').value.trim();
    if(!/^https?:\/\//i.test(u)){toast('http から始まる URL を入れてください');return;}
    busy('確認しています…');
    const hit=await firstLoadable([u]);
    if(hit) setUrl(hit); else { show(''); toast('この URL は表示できませんでした'); }
  };
  return { setData };
}

function shrink(file){ // File でも Blob でも可
  return new Promise((res,rej)=>{const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const W=400,h=Math.round(im.height*W/im.width);
        const c=document.createElement('canvas');c.width=W;c.height=h;
        c.getContext('2d').drawImage(im,0,0,W,h);res(c.toDataURL('image/jpeg',.8));};
      im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);});
}

/* ---------- 話数の取り込み ---------- */
// TMDB の TV は全シーズンの各話タイトル・放送日まで取れる。
// AniList は総話数しか持たないので、番号だけの枠を作る。
async function fetchEpisodesTMDB(tvId){
  const base='https://api.themoviedb.org/3/tv/'+tvId+'?language=ja-JP&api_key='+encodeURIComponent(settings.tmdbKey);
  const det=await (await fetch(base)).json();
  const seasons=(det.seasons||[]).filter(s=>s.season_number>0).slice(0,20);
  const out=[];
  for(const s of seasons){
    const u='https://api.themoviedb.org/3/tv/'+tvId+'/season/'+s.season_number
      +'?language=ja-JP&api_key='+encodeURIComponent(settings.tmdbKey);
    const sd=await (await fetch(u)).json();
    (sd.episodes||[]).forEach(e=>out.push({
      k:s.season_number+'-'+e.episode_number, s:s.season_number, n:e.episode_number,
      title:e.name||'', air:e.air_date||''}));
  }
  return {episodes:out, multiSeason:seasons.length>1};
}
async function fetchEpisodeCountAniList(id){
  const query=`query($id:Int){Media(id:$id){episodes nextAiringEpisode{episode}}}`;
  const r=await fetch('https://graphql.anilist.co',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{id:+id}})});
  const d=await r.json();
  const m=d.data?.Media||{};
  return m.episodes || (m.nextAiringEpisode?.episode ? m.nextAiringEpisode.episode-1 : 0);
}
function makeNumberedEpisodes(n){
  return Array.from({length:n},(_,i)=>({k:'1-'+(i+1),s:1,n:i+1,title:'',air:''}));
}
const epLabel=(e,multi)=> (multi?e.s+'-'+e.n : '第'+e.n+'話');
const epText=(e,multi)=> (multi?`S${e.s} 第${e.n}話` : `第${e.n}話`)+(e.title?'　'+e.title:'');

    <div class="divider"></div>
    <div class="sectitle">話数の記録<span>見るたびに増えていきます</span></div>

      <input class="in" type="date" id="lgDate" value="${today()}" style="flex:1.15">

    <textarea class="in" id="lgBody" placeholder="そのとき思ったことを、ひとことでも。" style="min-height:72px"></textarea>
    <div style="height:9px"></div><button class="btn ghost" id="lgSave">この回を記録する</button>
    <div id="logs" style="margin-top:16px"></div>

    <div class="divider"></div>
    <button class="btn danger" id="del">この作品を書庫から外す</button>
    <div class="hint" id="delHint"></div>`);

  /* ---- 話数エリア ---- */
  let selKey=null;
  const seenKeys=()=>new Set((w.logs||[]).map(l=>l.epKey).filter(Boolean));
  function paintEpisodes(){
    const a=$('#epArea'); a.innerHTML='';
    const eps=w.episodes||[];
    const canFetch = /^(tmdb|anilist):/.test(w.source||'');

    if(!eps.length){
      if(w.cat==='movie'||w.cat==='doujin'){
        a.innerHTML='<div class="hint" style="margin-top:0">巻数や再視聴の回数は、右の欄に自由に書けます。</div>'
          +'<div style="height:10px"></div>';
        addManualCount(a); return;
      }
      const b=el('button','btn ghost'); b.id='epFetch';
      b.textContent = canFetch? '話数を取り込む' : '話数を作る';
      a.appendChild(b);
      const h=el('div','hint');
      h.textContent = canFetch
        ? (w.source.startsWith('tmdb')? 'TMDB から各話のタイトルと放送日を取り込みます。'
           : 'AniList からは総話数のみ取り込めます（サブタイトルは付きません）。')
        : '総話数を入れると、第1話からの枠を作ります。';
      a.appendChild(h);
      b.onclick=()=>importEpisodes(b,h);
      if(!canFetch){a.innerHTML='';addManualCount(a);}
      return;
    }

    const seen=seenKeys();
    const done=eps.filter(e=>seen.has(e.k)).length;
    const multi=eps.some(e=>e.s>1);
    const bar=el('div');
    bar.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--paper-dim)">
      <span>全${eps.length}話中 ${done}話を記録</span>
      <button id="epReset" style="font-size:11px;color:#5D6675">枠を作り直す</button></div>
      <div class="prog"><i style="width:${eps.length?done/eps.length*100:0}%"></i></div>`;
    a.appendChild(bar);

    if(selKey===null){
      const next=eps.find(e=>!seen.has(e.k));
      selKey = next? next.k : eps[eps.length-1].k;
    }
    const cur=eps.find(e=>e.k===selKey);
    if(cur){const t=el('div','eptitle');
      t.innerHTML=`<b>${esc(multi?`S${cur.s} 第${cur.n}話`:`第${cur.n}話`)}</b>`
        +esc(cur.title|| (cur.air? cur.air+' 放送':'サブタイトルなし'));
      a.appendChild(t);}

    const row=el('div','eps');
    eps.forEach(e=>{
      const b=el('button'); b.textContent=epLabel(e,multi);
      if(seen.has(e.k)) b.classList.add('seen');
      b.setAttribute('aria-pressed', e.k===selKey);
      b.onclick=()=>{selKey=e.k; $('#lgEp').value=epText(e,multi); paintEpisodes(); refresh();};
      row.appendChild(b);
    });
    a.appendChild(row);
    $('#lgEp').value = cur? epText(cur,multi) : '';
    $('#epReset').onclick=async()=>{w.episodes=[];selKey=null;await saveWorks();paintEpisodes();};
    requestAnimationFrame(()=>{const sel=row.querySelector('[aria-pressed="true"]');
      if(sel) row.scrollLeft=Math.max(0,sel.offsetLeft-90);});

  function addManualCount(a){
    const r=el('div','row');
    r.innerHTML=`<input class="in" id="epNum" inputmode="numeric" placeholder="総話数・巻数">
      <button class="btn ghost" id="epMake" style="flex:0 0 92px">枠を作る</button>`;
    a.appendChild(r);
    $('#epMake').onclick=async()=>{
      const n=parseInt($('#epNum').value,10);
      if(!n||n<1||n>2000){toast('1〜2000 の数字を入れてください');return;}
      w.episodes=makeNumberedEpisodes(n); selKey=null;
      await saveWorks(); paintEpisodes(); toast(n+'話ぶんの枠を作りました');};
  }
  async function importEpisodes(btn,hint){
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> 取り込んでいます…';
    try{
      const [kind,sid]=w.source.split(':');
      if(kind==='tmdb'){
        if(!settings.tmdbKey) throw new Error('nokey');
        const {episodes}=await fetchEpisodesTMDB(sid);
        if(!episodes.length) throw new Error('empty');
        w.episodes=episodes;
      }else{
        const n=await fetchEpisodeCountAniList(sid);
        if(!n) throw new Error('empty');
        w.episodes=makeNumberedEpisodes(n);
      }
      selKey=null; await saveWorks(); paintEpisodes();
      toast(w.episodes.length+'話ぶん取り込みました');
    }catch(e){
      btn.disabled=false; btn.textContent='話数を取り込む';
      hint.textContent = e.message==='nokey' ? 'TMDB のキーが未設定です。⚙ から登録してください。'
        : e.message==='empty' ? '話数の情報が見つかりませんでした。下の欄から手で作れます。'
        : '取り込みに失敗しました。通信を確認してください。';
      const a=$('#epArea'); addManualCount(a);
    }
  }

  {
    const dImg=$('.dhead .cover img');
    if(dImg) applyFit($('.dhead .cover'), dImg, src, w, w.cat==='doujin'?'wide':'tall');
  }

  const flagText={want:'これから',watching:'見てる',done:'見た',paused:'中断',dropped:'やめた'};
  const paintFlag=()=>{const f=$('#dFlag'); f.className='flag '+w.status; f.textContent=flagText[w.status];};
  const paintRate=()=>{
    [...$('#rate').children].forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===w.rating));
    $('#rateNote').textContent = w.rating? '★'.repeat(w.rating)+'　'+RATE[w.rating] : 'まだ評価していません';};
  // 記録の並び順と絞り込み
  let logScope='ep', logSort='ep', logAsc=true;
  const epNo=l=>{ const m=/^(\d+)-(\d+)$/.exec(l.epKey||''); return m? [+m[1],+m[2]] : [9999,9999]; };

  const refresh=()=>{
    const box=$('#logs'); box.innerHTML='';
    const all=[...(w.logs||[])];
    const hasEps=(w.episodes||[]).length>0;
    const scoped = (hasEps && logScope==='ep' && selKey) ? all.filter(l=>l.epKey===selKey) : all;

    const ls=[...scoped].sort((a,b)=>{
      if(logSort==='ep'){
        const A=epNo(a),B=epNo(b);
        if(A[0]!==B[0]) return A[0]-B[0];
        if(A[1]!==B[1]) return A[1]-B[1];
      }
      return String(a.date||'').localeCompare(String(b.date||''));
    });
    if(!logAsc) ls.reverse();

    if(all.length){
      const cur=(w.episodes||[]).find(e=>e.k===selKey);
      const bar=el('div','logbar');
      bar.innerHTML=`
        ${hasEps? `<button data-k="scope" aria-pressed="${logScope==='ep'}">${
          cur? esc((w.episodes.some(e=>e.s>1)?`S${cur.s} 第${cur.n}話`:`第${cur.n}話`)+'だけ') : 'この話だけ'}</button>`:''}
        <span style="flex:1"></span>
        <button data-k="sort" aria-pressed="${logSort==='ep'}">${logSort==='ep'?'話数順':'日付順'}</button>
        <button data-k="asc">${logAsc?'↑ 古い順':'↓ 新しい順'}</button>`;
      bar.onclick=e=>{
        const b=e.target.closest('button'); if(!b) return;
        if(b.dataset.k==='scope') logScope = logScope==='ep'?'all':'ep';
        if(b.dataset.k==='sort')  logSort  = logSort==='ep'?'date':'ep';
        if(b.dataset.k==='asc')   logAsc   = !logAsc;
        refresh();
      };
      box.appendChild(bar);
    }

    if(!ls.length){
      const h=el('div','hint');
      h.textContent = !all.length ? 'まだ記録はありません。'
        : (hasEps&&logScope==='ep') ? 'この話の記録はまだありません。「ぜんぶ」を押すと全部見られます。'
        : 'まだ記録はありません。';
      box.appendChild(h);
    }

    let lastEp=null;
    ls.forEach(l=>{
      // 話数が変わるところに区切りを入れる
      if(logSort==='ep' && logScope!=='ep' && l.epKey && l.epKey!==lastEp){
        lastEp=l.epKey;
      }
      const d=el('div','log'+(l.epKey&&l.epKey===selKey?' cur':''));
      d.innerHTML=`<div class="d">${esc(l.ep||'')}${l.ep&&l.date?' 　':''}${esc(l.date||'')}</div>
        <div class="b">${esc(l.body)}</div><button class="del">削除</button>`;
      d.querySelector('.del').onclick=async()=>{
        w.logs=w.logs.filter(x=>x.id!==l.id); w.updatedAt=Date.now();
        await saveWorks(); refresh(); paintEpisodes(); render();};
      box.appendChild(d);});
    const tot=(w.episodes||[]).length;
    $('#cnt').textContent = (w.review?'総評あり':'総評なし') + ' 　記録 '+ls.length+'件'+(tot?' / 全'+tot+'話':'');
    $('#rvMeta').textContent = w.reviewAt ? ('最後に書いたのは '+w.reviewAt) : 'まだ書いていません';
  };
  paintFlag(); paintRate(); refresh(); paintEpisodes();

  $('#stSeg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.status=b.dataset.s; w.updatedAt=Date.now();

    paintFlag(); await saveWorks(); render(); toast(STAT[w.status]);};

  $('#editCover').onclick=()=>openCoverEditor(w.id);

  $('#catSeg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.cat=b.dataset.c; w.updatedAt=Date.now();
    [...$('#catSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#sheetTitle').textContent=CATS[w.cat];
    await saveWorks(); paintEpisodes(); render(); toast(CATS[w.cat]+'にしました');};

  $('#rate').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    w.rating=+b.dataset.v; w.updatedAt=Date.now(); paintRate(); await saveWorks(); render();};

  $('#rvSave').onclick=async()=>{
    const v=$('#rvBody').value.trim();
    if(v===(w.review||'')){toast('変更はありません');return;}
    w.review=v; w.reviewAt=today(); w.updatedAt=Date.now();
    await saveWorks(); refresh(); render();
    toast(v?'総評を保存しました':'総評を空にしました');};

  $('#lgSave').onclick=async()=>{
    const body=$('#lgBody').value.trim(), ep=$('#lgEp').value.trim();
    if(!body&&!ep){toast('ひとことでも書いてみてください');return;}
    w.logs=[...(w.logs||[]),{id:uid(),date:$('#lgDate').value||today(),ep,epKey:selKey||'',body}];
    w.updatedAt=Date.now();
    if(w.status==='want'){w.status='watching';
      [...$('#stSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='watching'));paintFlag();}
    $('#lgBody').value='';
    // 記録できたら自動で次の話へ進める
    const eps=w.episodes||[];
    if(eps.length){
      const seen=new Set((w.logs||[]).map(l=>l.epKey).filter(Boolean));
      const next=eps.find(e=>!seen.has(e.k));
      selKey = next? next.k : null;
      if(!next && w.status!=='done'){
        w.status='done';
        [...$('#stSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='done'));
        paintFlag(); toast('最終話まで記録。「見た」にしました');
      }
    }else{$('#lgEp').value='';}
    await saveWorks(); refresh(); paintEpisodes(); render();
    if(eps.length && selKey) toast('記録しました');
    else if(!eps.length) toast('記録しました');};

  const syn=$('#syn'); if(syn) $('#synMore').onclick=e=>{syn.classList.toggle('open');
    e.target.textContent=syn.classList.contains('open')?'閉じる':'続きを読む';};

  // 二段階削除（confirm はこの環境で効かないため）
  let armed=false, armT;
  const delBtn=$('#del');
  delBtn.onclick=async()=>{
    if(!armed){
      armed=true; delBtn.classList.add('armed');
      delBtn.textContent='もう一度押すと削除します';
      $('#delHint').textContent='記録 '+(w.logs?.length||0)+'件ごと消えます。4秒待つと取り消されます。';
      armT=setTimeout(()=>{armed=false;delBtn.classList.remove('armed');
        delBtn.textContent='この作品を書庫から外す';$('#delHint').textContent='';},4000);
      return;
    }
    clearTimeout(armT);
    works=works.filter(x=>x.id!==w.id);
    await saveWorks();
    await sdel('shoko:img:'+w.id);
    imgCache.delete(w.id);
    closeSheet(); render(); toast('「'+w.title+'」を書庫から外しました');};
}


/* ---------- ほかのアプリからの取り込み ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===',') { row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); cell=''; rows.push(row); row=[]; }
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function rowsToObjects(rows){
  if(rows.length<2) return [];
  const head=rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(r=>{
    const o={}; head.forEach((h,i)=>{ if(h) o[h]=r[i]??''; }); return o;
  });
}
// 入れ子の JSON でも配列を探し出す
function findRecordArray(data){
  if(Array.isArray(data)) return data;
  if(data && typeof data==='object'){
    for(const k of ['works','items','records','data','rows','list','entries','Sheet1']){
      if(Array.isArray(data[k])) return data[k];
    }
    for(const v of Object.values(data)) if(Array.isArray(v)&&v.length&&typeof v[0]==='object') return v;
  }
  return [];
}
const GUESS={
  title:[/^title$/i,/title/i,/^name$/i,/name/i,/タイトル/,/作品名/,/作品/,/題名/],
  cover:[/cover/i,/image/i,/poster/i,/thumb/i,/picture/i,/画像/,/表紙/,/サムネ/,/ジャケ/],
  review:[/review/i,/comment/i,/^note/i,/memo/i,/impress/i,/感想/,/総評/,/メモ/,/レビュー/],
  status:[/status/i,/state/i,/watched/i,/状態/,/ステータス/,/視聴状況/,/進捗/],
  rating:[/rating/i,/score/i,/star/i,/評価/,/点数/,/星/],
  year:[/year/i,/release/i,/公開/,/放送/,/発売/,/^年/,/日付/,/date/i],
  maker:[/maker/i,/circle/i,/studio/i,/author/i,/creator/i,/brand/i,/サークル/,/制作/,/作者/,/メーカー/],
  cat:[/categor/i,/^type$/i,/genre/i,/media/i,/分類/,/種別/,/媒体/,/ジャンル/],
  rj:[/^rj/i,/dlsite/i,/作品番号/,/品番/,/^code$/i,/商品id/i]
};
function guessColumn(cols,field){
  for(const re of GUESS[field]||[]) { const hit=cols.find(c=>re.test(c)); if(hit) return hit; }
  return '';
}
function guessStatus(v){
  const s=String(v??'').toLowerCase();
  if(/見た|観た|視聴済|完了|済|done|watched|complete|finish/.test(s)) return 'done';
  if(/見てる|見中|視聴中|途中|watching|progress|reading/.test(s))     return 'watching';
  if(/中断|保留|paused|hold/.test(s))                                  return 'paused';
  if(/やめ|中止|drop|stop/.test(s))                                    return 'dropped';
  return 'want';
}
function guessCat(v,fallback){
  const s=String(v??'').toLowerCase();
  if(/映画|movie|film|劇場/.test(s))            return 'movie';
  if(/ドラマ|drama|tv|海外|連続/.test(s))       return 'drama';
  if(/アニメ|anime|animation/.test(s))          return 'anime';
  if(/同人|doujin|dojin|音声|asmr|cg集|同人誌/.test(s)) return 'doujin';
  return fallback;
}
function normRating(v){
  const n=parseFloat(String(v??'').replace(/[^0-9.]/g,''));
  if(!isFinite(n)||n<=0) return 0;
  return Math.max(1,Math.min(5, n>5? Math.round(n/2) : Math.round(n)));
}
function normYear(v){
  const m=String(v??'').match(/(19|20)\d{2}/); return m? m[0] : '';
}


/* ---------- SakuLog（TMDB 生データ形式）からの取り込み ---------- */
function looksLikeSakuLog(arr){
  if(!Array.isArray(arr)||!arr.length) return false;
  const hit=arr.filter(r=>r&&typeof r==='object'&&'media_type' in r&&'status' in r
    &&('poster_path' in r||'overview' in r)).length;
  return hit >= Math.max(1, Math.floor(arr.length*0.6));
}
const msToYMD = ms=>{
  const d=new Date(Number(ms));
  if(isNaN(d.getTime())) return today();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
};
const SAKU_STATUS={watched:'done',watching:'watching',planned:'want',
  paused:'paused',dropped:'dropped',want:'want',plan_to_watch:'want'};

function openSakuLogImport(arr){
  const anim = arr.filter(r=>(r.genre_ids||[]).includes(16)).length;
  const tv   = arr.filter(r=>r.media_type==='tv').length;
  const notes= arr.reduce((n,r)=>n+(r.episodeNotes?.length||0),0);

  openSheet('SakuLog から取り込む',`

    <label class="f">アニメ映画の扱い</label>
    <div class="seg" id="animeMovie">

      ・表紙とあらすじ（TMDB から復元）<br>
      ・視聴状態（watched → 見た、planned → これから、watching → 見てる）<br>
      ・評価 ${revs?'':''}（小数は四捨五入して 5 段階に）<br>
      ・総評 ${revs}件、話数ごとのメモ ${notes}件<br>
      ・感情タグの絵文字は総評の末尾に添えます
    </div>

    <div class="divider"></div>
    <button class="btn" id="doSaku">${arr.length}件を取り込む</button>
    <div class="hint">同じ作品が既にあれば飛ばします。何度実行しても重複しません。</div>
    <div style="height:10px"></div>
    <button class="btn ghost" id="toMapper">列を自分で対応づける</button>
  `);

  $('#animeMovie').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$('#animeMovie').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};
  $('#toMapper').onclick=()=>openImportMapper(arr,'JSON');

  $('#doSaku').onclick=async()=>{

    const have=new Set(works.map(w=>w.source).filter(x=>x&&x!=='manual'&&x!=='import'));
    let added=0,skipped=0;

    for(const r of arr){
      const title=(r.title||r.name||r.original_title||r.original_name||'').trim();
      if(!title) continue;
      const src = r.id? 'tmdb:'+r.id : '';
      const dupKey = src+'|'+r.media_type;
      if(src && have.has(dupKey)){ skipped++; continue; }
      if(src) have.add(dupKey);

      const isAnim=(r.genre_ids||[]).includes(16);
      const cat = isAnim ? (r.media_type==='movie' && animeMovieAs==='movie' ? 'movie' : 'anime')
                         : (r.media_type==='movie' ? 'movie' : 'drama');

        epKey:'1-'+n.episode, body:String(n.note||'').trim()

      if(String(r.episodeNote||'').trim())
        logs.push({id:uid(),date:msToYMD(r.addedAt),ep:'',epKey:'',body:String(r.episodeNote).trim()});

      // 話数の枠：メモが指す最大話数と currentEpisode の大きいほう
      const maxEp=Math.max(0, Number(r.currentEpisode)||0,
        ...(r.episodeNotes||[]).map(n=>Number(n.episode)||0));
      const episodes = (r.media_type==='tv' && maxEp>0) ? makeNumberedEpisodes(maxEp) : [];

      let review=String(r.review||'').trim();
      const tags=(r.emotionTags||[]).join('');
      if(tags) review = review ? review+'\n\n'+tags : tags;

      const rate=Number(r.rating)||0;
      works.push({
        id:uid(), batch, cat, title,
        maker:'', year:String(r.release_date||r.first_air_date||'').slice(0,4),
        cover: r.poster_path? 'https://image.tmdb.org/t/p/w342'+r.poster_path : '',

        source: src||'import',
        status: SAKU_STATUS[String(r.status||'').toLowerCase()] || 'want',
        rating: rate>0? Math.max(1,Math.min(5,Math.round(rate))) : 0,
        review, reviewAt: review? msToYMD(r.addedAt) : '',
        adult: !!(r.adult || r.softcore),
        logs, episodes,
        createdAt: Number(r.addedAt)||Date.now(),
        updatedAt: Number(r.addedAt)||Date.now()
      });
      added++;
    }
    settings.lastImport = added? {batch,count:added,at:Date.now(),label:'SakuLog'} : settings.lastImport;
    await saveWorks(); await saveSettings(); closeSheet(); render();
    toast(added+'件を取り込みました'+(skipped?'（'+skipped+'件は重複）':''));
  };
}

function openImportMapper(records,label){

  const F=[
    ['title','タイトル','必須'],
    ['cat','分類','映画 / ドラマ / アニメ / 同人'],
    ['status','状態','見た・見たい など'],
    ['rating','評価','5段階でも10段階でも可'],
    ['review','総評・感想',''],
    ['cover','表紙の画像URL',''],
    ['maker','サークル・制作',''],
    ['year','年',''],
    ['rj','DLsite の作品番号','RJ番号があれば表紙を探せます']

  openSheet('取り込み：列の対応づけ',`
    <div class="hint" style="margin-top:0">${esc(label)}から <b>${records.length}件</b> 読み込みました。
      どの列がどこに入るかを決めてください。自動で推測した内容が入っています。</div>
    ${F.map(([k,name,note])=>`
      <label class="f">${name}${note?`<span style="color:#5A6472;font-family:var(--gothic);letter-spacing:0;margin-left:8px">${note}</span>`:''}</label>
      <select class="in" id="map_${k}">${opt(guessColumn(cols,k))}</select>`).join('')}

    <label class="f">分類が読み取れないときの既定</label>
    <div class="seg" id="defCat">${Object.entries(CATS).map(([k,v],i)=>
      `<button data-c="${k}" aria-pressed="${i===0}">${v}</button>`).join('')}</div>

    <label class="f">伏せ字の扱い</label>
    <div class="seg" id="defAdult">
      <button data-a="auto" aria-pressed="true">同人だけ伏せる</button>
      <button data-a="all">すべて伏せる</button>
      <button data-a="none">伏せない</button></div>

    <div class="divider"></div>
    <div id="preview"></div>
    <div style="height:12px"></div>
    <button class="btn" id="doImport">この対応で取り込む</button>
    <div class="hint">いまある記録はそのまま残り、追加されます。同じタイトルが既にある場合は飛ばします。</div>
  `);

  const getMap=()=>Object.fromEntries(F.map(([k])=>[k,$('#map_'+k).value]));
  const defCat=()=>$('#defCat').querySelector('[aria-pressed="true"]').dataset.c;
  const defAdult=()=>$('#defAdult').querySelector('[aria-pressed="true"]').dataset.a;

  const build=()=>{
    const m=getMap(), fb=defCat(), ad=defAdult();
    return records.map(r=>{
      const title=String(m.title? r[m.title]??'' : '').trim();
      if(!title) return null;
      const cat = m.cat? guessCat(r[m.cat],fb) : fb;
      const rawCover=String(m.cover? r[m.cover]??'' : '').trim();
      const urlInCell=(rawCover.match(/https?:\/\/\S+/)||[])[0]||'';
      const rj=String(m.rj? r[m.rj]??'' : '').trim();
      return {
        title, cat,
        status: m.status? guessStatus(r[m.status]) : 'want',
        rating: m.rating? normRating(r[m.rating]) : 0,
        review: String(m.review? r[m.review]??'' : '').trim(),
        cover: urlInCell, rj,
        maker: String(m.maker? r[m.maker]??'' : '').trim(),
        year: m.year? normYear(r[m.year]) : '',
        adult: ad==='all'? true : ad==='none'? false : cat==='doujin'

  const paintPreview=()=>{

        btn.innerHTML=`<span class="spin"></span> 表紙を探しています… ${Math.min(i+4,needs.length)}/${needs.length}`;

      have.add(b.title.toLowerCase());
      works.push({ id:uid(), batch, cat:b.cat, title:b.title, maker:b.maker, year:b.year,
        cover:b.cover, synopsis:'', source:'import', status:b.status, rating:b.rating,
        review:b.review, reviewAt: b.review? today() : '', adult:b.adult,

      added++;
    }
    settings.lastImport = added? {batch,count:added,at:Date.now(),label:'ファイル'} : settings.lastImport;
    await saveWorks(); await saveSettings(); closeSheet(); render();
    toast(added+'件を取り込みました'+(skipped?'（'+skipped+'件は重複のため飛ばしました）':''));
  };
}

async function readImportFile(file){
  const text=await file.text();
  const name=(file.name||'').toLowerCase();
  try{
    if(name.endsWith('.csv')||name.endsWith('.tsv')||(!name.endsWith('.json')&&text.includes(','))){
      const rows=parseCSV(text);
      const objs=rowsToObjects(rows);
      if(!objs.length) throw new Error('中身が読み取れませんでした');
      openImportMapper(objs,'CSV');
      return;
    }
    const data=JSON.parse(text);
    // 書庫が書き出した形式ならそのまま復元する
    if(data && data.app==='shoko' && Array.isArray(data.works)){ await restoreOwnBackup(data.works); return; }
    const arr=findRecordArray(data);
    if(!arr.length) throw new Error('作品の配列が見つかりませんでした');
    if(looksLikeSakuLog(arr)){ openSakuLogImport(arr); return; }
    openImportMapper(arr,'JSON');
  }catch(e){
    toast(e.message||'このファイルは読み込めませんでした');
  }
}
async function restoreOwnBackup(arr){
  const batch='b'+Date.now();
  for(const w of arr){
    const id=uid();
    if(w.imageData){ await sset('shoko:img:'+id,w.imageData); imgCache.set(id,w.imageData); w.cover='local:'+id; }
    delete w.imageData;
    works.push({...w,id,batch,logs:w.logs||[],review:w.review||'',episodes:w.episodes||[],updatedAt:w.updatedAt||Date.now()});
  }
  settings.lastImport={batch,count:arr.length,at:Date.now(),label:'バックアップ'};
  await saveWorks(); await saveSettings(); closeSheet(); render(); toast(arr.length+'件を復元しました');
}

// ファイル名からタイトルらしき部分を取り出す
function titleFromFilename(name){
  let t=String(name||'').replace(/\.[a-z0-9]{2,5}$/i,'');
  t=t.replace(/(RJ|VJ|BJ|RE|VE|BE)\d{5,10}/ig,' ');
  t=t.replace(/[[(【（][^\])】）]{0,40}[\])】）]/g,' ');
  t=t.replace(/[_\-–—]+/g,' ').replace(/\s{2,}/g,' ').trim();
  return t || String(name||'').replace(/\.[a-z0-9]{2,5}$/i,'');
}
const rjFromFilename = n=>((String(n).match(/(RJ|VJ|BJ|RE|VE|BE)\d{5,10}/i)||[])[0]||'').toUpperCase();
const normTitle = t=>String(t||'').toLowerCase().replace(/[\s　_\-–—.,!?！？「」『』()（）[\]【】]/g,'');
// ファイル名と作品名の近さをざっくり測る
function similarity(a,b){
  a=normTitle(a); b=normTitle(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return 0.9;
  const short=a.length<b.length?a:b, long=a.length<b.length?b:a;
  let hit=0;
  for(let i=0;i<short.length-1;i++) if(long.includes(short.substr(i,2))) hit++;
  return short.length>1 ? hit/(short.length-1)*0.8 : 0;
}

function openBulkImages(){
  openSheet('画像をまとめて登録',`
    <div class="hint" style="margin-top:0">パソコンに保存した表紙画像を、いちどに全部読み込めます。
      ファイル名がタイトルの下書きになります。</div>
    <div style="height:14px"></div>
    <button class="btn" id="blPick">画像をまとめて選ぶ</button>
    <input type="file" accept="image/*" multiple id="blFile" style="display:none">
    <div class="hint">まとめて選ぶには、ファイル選択画面で Ctrl+A（全選択）や Shift+クリック（範囲選択）を使ってください。</div>
    <div id="blArea"></div>`);
  $('#blPick').onclick=()=>$('#blFile').click();
  $('#blFile').onchange=async e=>{
    const files=[...e.target.files]; e.target.value='';
    if(!files.length) return;
    await prepare(files);
  };

  let rows=[];
  const prepare=async files=>{
    const area=$('#blArea');
    area.innerHTML='<div class="hint"><span class="spin"></span> 読み込んでいます… 0/'+files.length+'</div>';
    rows=[];
    for(let i=0;i<files.length;i++){
      area.firstChild.innerHTML='<span class="spin"></span> 読み込んでいます… '+(i+1)+'/'+files.length;
      try{
        const data=await shrink(files[i]);
        rows.push({ id:uid(), file:files[i].name, data,
          title:titleFromFilename(files[i].name), rj:rjFromFilename(files[i].name),
          target:'', keep:true });
      }catch(err){}
    }
    paint();
  };

  const paint=()=>{
    const area=$('#blArea');
    if(!rows.length){ area.innerHTML='<div class="hint">読み込める画像がありませんでした。</div>'; return; }
    const noCover=works.filter(w=>!w.cover);
    const alive=rows.filter(r=>r.keep);

    area.innerHTML=`
      <div class="divider"></div>
      <div class="sectitle">${alive.length}枚<span>いらないものは ✕ で外せます</span></div>

      <label class="f">どうする</label>
      <div class="seg" id="blMode">
        <button data-m="new" aria-pressed="true">新しく登録する</button>
        <button data-m="assign" ${noCover.length?'':'disabled'}>表紙のない作品に付ける${noCover.length?'（'+noCover.length+'件）':''}</button>
      </div>

      <div id="blOpts"></div>
      <div id="blList" style="margin-top:14px"></div>
      <div style="height:16px"></div>
      <button class="btn" id="blGo"></button>`;

    $('#blMode').onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
      [...$('#blMode').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
      if(b.dataset.m==='assign') autoMatch();
      paintBody();};
    paintBody();
  };

  const mode=()=>$('#blMode')?.querySelector('[aria-pressed="true"]')?.dataset.m || 'new';

  const autoMatch=()=>{
    const pool=works.filter(w=>!w.cover);
    const used=new Set();
    rows.filter(r=>r.keep).forEach(r=>{
      let best=null,score=0;
      for(const w of pool){
        if(used.has(w.id)) continue;
        const sc=Math.max(similarity(r.title,w.title), r.rj&&w.maker? similarity(r.rj,w.maker):0);
        if(sc>score){score=sc;best=w;}
      }
      if(best&&score>=0.55){ r.target=best.id; used.add(best.id); }
      else r.target='';
    });
  };

  const paintBody=()=>{
    const m=mode();
    $('#blOpts').innerHTML = m==='new' ? `
      <label class="f">分類</label>
      <div class="seg" id="blCat">${Object.keys(CATS).map(k=>
        `<button data-c="${k}" aria-pressed="${k==='doujin'}">${CATS[k]}</button>`).join('')}</div>
      <label class="f" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="blAdult" checked style="width:auto"> すべて伏せ字表示の対象にする</label>` : `
      <div class="hint">ファイル名から近そうな作品を自動で選んであります。違うものは選び直してください。</div>`;
    if(m==='new') $('#blCat').onclick=e=>{const b=e.target.closest('button');if(!b)return;
      [...$('#blCat').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};

    const noCover=works.filter(w=>!w.cover);
    const list=$('#blList'); list.innerHTML='';
    rows.forEach(r=>{
      if(!r.keep) return;
      const row=el('div','blrow');
      row.innerHTML=`
        <img src="${esc(r.data)}" alt="">
        <div class="body">
          ${m==='new'
            ? `<input class="in" value="${esc(r.title)}" data-id="${r.id}" data-k="title" placeholder="タイトル">`
            : `<select class="in" data-id="${r.id}" data-k="target">
                 <option value="">— 付けない —</option>
                 ${noCover.map(w=>`<option value="${w.id}"${w.id===r.target?' selected':''}>${esc(w.title)}</option>`).join('')}
               </select>`}
          <div class="fn">${esc(r.file)}</div>
        </div>
        <button class="x" data-id="${r.id}" data-k="drop">✕</button>`;
      list.appendChild(row);
    });
    list.oninput=e=>{
      const t=e.target, r=rows.find(x=>x.id===t.dataset.id); if(!r) return;
      if(t.dataset.k==='title') r.title=t.value;
      if(t.dataset.k==='target') r.target=t.value;
    };
    list.onclick=e=>{
      const b=e.target.closest('[data-k="drop"]'); if(!b) return;
      const r=rows.find(x=>x.id===b.dataset.id); if(r){ r.keep=false; paint(); }
    };

    const n=rows.filter(r=>r.keep && (m==='new'? r.title.trim() : r.target)).length;
    const go=$('#blGo');
    go.textContent = m==='new' ? n+'件を登録する' : n+'件に表紙を付ける';
    go.disabled = !n;
    go.onclick=()=>run(m);
  };

  const run=async m=>{
    const go=$('#blGo'); go.disabled=true;
    const batch='b'+Date.now();
    const target=rows.filter(r=>r.keep && (m==='new'? r.title.trim() : r.target));
    let done=0;
    const cat = m==='new' ? $('#blCat').querySelector('[aria-pressed="true"]').dataset.c : null;
    const adult = m==='new' ? $('#blAdult').checked : false;

    for(const r of target){
      go.innerHTML='<span class="spin"></span> 保存しています… '+(++done)+'/'+target.length;
      if(m==='new'){
        const id=uid();
        await sset('shoko:img:'+id, r.data); imgCache.set(id,r.data);
        works.unshift({ id, batch, cat, title:r.title.trim(), maker:'', year:'',
          cover:'local:'+id, synopsis:'', source:'manual', status:'want', rating:0,
          review:'', episodes:[], adult, logs:[], createdAt:Date.now(), updatedAt:Date.now() });
      }else{
        const w=works.find(x=>x.id===r.target); if(!w) continue;
        if(String(w.cover||'').startsWith('local:')) await sdel('shoko:img:'+w.id);
        await sset('shoko:img:'+w.id, r.data); imgCache.set(w.id,r.data);
        w.cover='local:'+w.id; w.updatedAt=Date.now();
      }
    }
    if(m==='new') settings.lastImport={batch,count:target.length,at:Date.now(),label:'画像'};
    await saveWorks(); await saveSettings();
    closeSheet(); render(); paintBackupBar();
    toast(m==='new'? target.length+'件を登録しました' : target.length+'件に表紙を付けました');
  };
}

/* ---------- settings ---------- */
function openSettings(){
  openSheet('設定',`
    <label class="f" style="margin-top:0">TMDB API キー</label>
    <input class="in" id="tk" value="${esc(settings.tmdbKey)}" placeholder="映画・ドラマ検索に必要">
    <div class="hint">themoviedb.org で無料アカウントを作り、設定 → API から取得できます。
      アニメ検索と手動登録はキー無しで使えます。</div>
    <div style="height:14px"></div><button class="btn" id="tkSave">キーを保存</button>
    <div style="height:8px"></div><button class="btn ghost" id="diag">接続を確認する</button>
    <div id="diagOut"></div>
    <div class="divider"></div>
    <label class="f" style="margin-top:0">持ち出しと引き継ぎ</label>
    <div class="hint">10年後もこの記録が読めるかどうかは、この機能にかかっています。ときどき書き出してください。</div>
    <div style="height:10px"></div>
    <button class="btn ghost" id="exp">JSON で書き出す（${works.length}件）</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="impBtn">書庫のバックアップを読み込む</button>
    <div class="hint">書き出しには手で入れた表紙画像も含まれます。読み込みは既存データに追加されます。</div>
    <div style="height:14px"></div>
    <button class="btn ghost" id="impOther">ほかのアプリから取り込む（JSON / CSV）</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="coverFill">表紙をまとめて付ける（${works.filter(w=>!w.cover).length}件）</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="bulkImg">画像をまとめて登録</button>
    <input type="file" id="imp" accept=".json,.csv,.tsv,application/json,text/csv" style="display:none">
    <div class="hint">AppSheet はスプレッドシートを CSV で書き出せば取り込めます。
      どの列が何なのかは、次の画面で対応づけます。</div>
    <div class="divider"></div>
    <label class="f" style="margin-top:0">まとめて消す</label>
    <div class="hint" style="margin-top:0">消したものは戻せません。心配なら先に書き出しておいてください。</div>
    <div style="height:10px"></div>
    <div id="undoWrap"></div>
    <button class="btn danger" id="wipeFiltered"></button>
    <div style="height:8px"></div>
    <button class="btn danger" id="wipeAll">すべての作品を削除（${works.length}件）</button>

    <div class="divider"></div>
    <label class="f" style="margin-top:0">このアプリについて</label>
    <div class="hint" style="margin-top:0">書庫 v${VERSION}（データ構造 v${SCHEMA}）</div>
    <div style="height:10px"></div>
    ${CHANGES.map(([v,t])=>`<div style="display:flex;gap:10px;font-size:11.5px;color:#6C7686;
      line-height:1.7;padding:3px 0"><span style="color:var(--brass-dim);flex:0 0 42px;
      font-family:var(--mincho)">${v}</span><span>${esc(t)}</span></div>`).join('')}`);
  $('#tkSave').onclick=async()=>{settings.tmdbKey=$('#tk').value.trim();await saveSettings();
    toast(settings.tmdbKey?'キーを保存しました':'キーを空にしました');};

  // 二度押しで実行する削除ボタン
  function arm(btn,label,run){
    let armed=false,t;
    btn.onclick=async()=>{
      if(!armed){ armed=true; btn.classList.add('armed');
        btn.textContent='もう一度押すと削除します';
        t=setTimeout(()=>{armed=false;btn.classList.remove('armed');btn.textContent=label;},4000);
        return; }
      clearTimeout(t); await run();
    };
    btn.textContent=label;
  }
  async function removeWorks(list){
    const ids=new Set(list.map(w=>w.id));
    for(const w of list) if(String(w.cover||'').startsWith('local:')){ await sdel('shoko:img:'+w.id); imgCache.delete(w.id); }
    works=works.filter(w=>!ids.has(w.id));
    await saveWorks();
  }

  // 直前の取り込みだけ取り消す
  const li=settings.lastImport;
  const liList = li? works.filter(w=>w.batch===li.batch) : [];
  if(liList.length){
    const b=el('button','btn danger'); b.id='undoImport';
    b.style.marginBottom='8px';
    $('#undoWrap').appendChild(b);
    arm(b,'直前の取り込みを取り消す（'+liList.length+'件・'+li.label+'）',async()=>{
      await removeWorks(liList);
      settings.lastImport=null; await saveSettings();
      closeSheet(); render(); paintBackupBar(); toast(liList.length+'件を取り消しました');
    });
  }

  // いま絞り込んでいる範囲だけ消す
  const fb=$('#wipeFiltered');
  const scoped = works.filter(w=>inScope(w,filter.cat)&&(filter.stat==='all'||w.status===filter.stat));
  if(filter.cat==='all'&&filter.stat==='all'){ fb.style.display='none'; }
  else{
    const names=[filter.cat==='all'?null:CATS[filter.cat],
                 filter.stat==='all'?null:STAT[filter.stat]].filter(Boolean).join(' / ');
    arm(fb,'絞り込み中のものを削除（'+names+'・'+scoped.length+'件）',async()=>{
      await removeWorks(scoped); closeSheet(); render(); paintBackupBar();
      toast(scoped.length+'件を削除しました');
    });
  }

  // 全消し
  arm($('#wipeAll'),'すべての作品を削除（'+works.length+'件）',async()=>{
    const n=works.length;
    await removeWorks([...works]);
    settings.lastImport=null; await saveSettings();
    closeSheet(); render(); paintBackupBar(); toast(n+'件すべて削除しました');
  });

  $('#diag').onclick=async()=>{
    const out=$('#diagOut');
    out.innerHTML='<div class="hint"><span class="spin"></span> 確認しています…</div>';
    const lines=[];
    // AniList（認証不要）
    try{
      const t0=Date.now();
      const r=await fetch('https://graphql.anilist.co',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:'{Media(id:1,type:ANIME){id}}'})});
      lines.push([r.ok,'AniList', r.ok? '応答あり（'+(Date.now()-t0)+'ms）' : 'HTTP '+r.status]);
    }catch(e){ lines.push([false,'AniList','届きません — '+(e.message||'原因不明')]); }
    // TMDB（キー必要）
    if(!settings.tmdbKey){ lines.push([false,'TMDB','キーが未設定です']); }
    else{
      try{
        const t0=Date.now();
        const r=await fetch('https://api.themoviedb.org/3/configuration?api_key='
          +encodeURIComponent(settings.tmdbKey));
        lines.push([r.ok,'TMDB', r.ok? 'キー有効（'+(Date.now()-t0)+'ms）'
          : (r.status===401? 'キーが無効です（401）' : 'HTTP '+r.status)]);
      }catch(e){ lines.push([false,'TMDB','届きません — '+(e.message||'原因不明')]); }
    }
    const allDown = lines.every(l=>!l[0]);
    out.innerHTML = lines.map(([ok,name,msg])=>
      `<div style="display:flex;gap:9px;font-size:12px;padding:4px 0;line-height:1.6">
        <span style="flex:0 0 14px;color:${ok?'var(--jade)':'var(--seal)'}">${ok?'✓':'✕'}</span>
        <span style="flex:0 0 58px;color:var(--paper-dim)">${name}</span>
        <span style="color:${ok?'var(--paper)':'var(--seal)'}">${esc(msg)}</span></div>`).join('')
      + (allDown? '<div class="hint">両方とも届いていません。このプレビュー画面が外部通信を止めている可能性が高く、その場合は自分のサーバや GitHub Pages に置けば直ります。</div>'
         : '<div class="hint">✓ が付いた側は使えます。</div>');
  };
  $('#exp').onclick=async()=>{
    const out=[];
    for(const w of works){const c={...w}; if(w.cover?.startsWith('local:')) c.imageData=await resolveCover(w); out.push(c);}
    const blob=new Blob([JSON.stringify({app:'shoko',appVersion:VERSION,schema:SCHEMA,
      exportedAt:new Date().toISOString(),count:out.length,works:out},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='shoko-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
    settings.lastExport=Date.now(); settings.backupHiddenUntil=0;
    await saveSettings(); paintBackupBar(); toast('書き出しました');};
  $('#impBtn').onclick=()=>{$('#imp').dataset.mode='own';$('#imp').click();};
  $('#impOther').onclick=()=>{$('#imp').dataset.mode='other';$('#imp').click();};
  $('#coverFill').onclick=openCoverFiller;
  $('#bulkImg').onclick=openBulkImages;
  $('#imp').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f)return;
    await readImportFile(f);};
}

// 共有されてきた画像の一時置き場
let pendingShared=null;

// 共有メニューから来たときの処理（文字なら検索、画像なら表紙として扱う）
async function handleShare(){
  const p=new URLSearchParams(location.search);
  const t=(p.get('title')||p.get('text')||'').trim();
  const hasImg=p.get('shared')==='1';
  if(!t&&!hasImg) return;
  history.replaceState(null,'',location.pathname);

  if(hasImg){
    let blob=null;
    try{ blob=await sget('shoko:shared'); await sdel('shoko:shared'); }catch(e){}
    if(blob){
      try{ pendingShared=await shrink(blob); }catch(e){ pendingShared=null; }
      if(pendingShared){ openSharedImage(pendingShared,t); return; }
    }
  }
  if(t){
    openAdd();
    setTimeout(()=>{const i=$('#apiq'); if(i){i.value=t.slice(0,80); i.dispatchEvent(new Event('input'));}},60);
  }
}

// 共有された画像を、どの作品の表紙にするか決める画面
function openSharedImage(dataUrl,title){
  const noCover=works.filter(w=>!w.cover);
  openSheet('共有された画像',`
    <div class="mcover" id="shPrev" style="margin:0 0 14px">
      <img src="${esc(dataUrl)}" alt=""><span>共有された画像</span></div>
    <div class="hint" style="margin-top:0">この画像をどうしますか。</div>
    <div style="height:14px"></div>
    <button class="btn" id="shNew">新しい作品として登録する</button>
    <div style="height:8px"></div>
    <label class="f" style="margin-top:6px">いまある作品の表紙にする</label>
    <input class="in" id="shQ" placeholder="作品名で探す${noCover.length?'（表紙なし '+noCover.length+'件）':''}">
    <div id="shList" style="margin-top:10px"></div>`);

  const paint=()=>{
    const q=$('#shQ').value.trim().toLowerCase();
    const list=(q? works.filter(w=>w.title.toLowerCase().includes(q)) : noCover).slice(0,20);
    const box=$('#shList'); box.innerHTML='';
    if(!list.length){ box.innerHTML='<div class="hint">該当する作品がありません。</div>'; return; }
    list.forEach(w=>{
      const b=el('button','res');
      b.innerHTML=`<div style="flex:1;min-width:0"><div class="t">${esc(w.title)}</div>
        <div class="m">${esc([CATS[w.cat],w.maker].filter(Boolean).join(' · '))}${w.cover?' · 表紙あり':''}</div></div>
        <span class="add">→</span>`;
      b.onclick=async()=>{
        if(String(w.cover||'').startsWith('local:')) await sdel('shoko:img:'+w.id);
        await sset('shoko:img:'+w.id,dataUrl); imgCache.set(w.id,dataUrl);
        w.cover='local:'+w.id; w.updatedAt=Date.now();
        pendingShared=null;
        await saveWorks(); closeSheet(); render(); toast('「'+w.title+'」の表紙にしました');
      };
      box.appendChild(b);
    });
  };
  $('#shQ').oninput=paint; paint();
  $('#shNew').onclick=()=>{
    openAdd();
    setTimeout(()=>{
      [...$('#srcSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.s==='manual'));
      addArea('manual');
      if(title) $('#mTitle').value=title.slice(0,120);
    },40);
  };
}

// 書き出しから日が空いたら知らせる
function paintBackupBar(){
  const bar=$('#backupBar'); bar.innerHTML='';
  if(!works.length || settings.backupHiddenUntil>Date.now()) return;
  const last=settings.lastExport||0;
  const days=last? Math.floor((Date.now()-last)/86400000) : null;
  if(last && days<30) return;
  const d=el('div','backupbar');
  d.innerHTML=`<span style="flex:1">${last? '最後の書き出しから'+days+'日たちました。'
    : 'まだ一度も書き出していません。'}端末を替えると記録は消えます。</span>
    <button id="bkNow">書き出す</button><button class="x" id="bkLater">後で</button>`;
  bar.appendChild(d);
  $('#bkNow').onclick=()=>{openSettings();setTimeout(()=>$('#exp')?.click(),120);};
  $('#bkLater').onclick=async()=>{settings.backupHiddenUntil=Date.now()+7*86400000;
    await saveSettings(); paintBackupBar();};
}

(async()=>{
  $('#verLabel').textContent='v'+VERSION;
  works=(await sget(KW))||[];
  // 旧データの移行：タグを廃止し、総評フィールドを用意する
  let migrated=false;
  works.forEach(w=>{
    if(w.review===undefined){w.review='';migrated=true;}
    if(w.tags!==undefined){delete w.tags;migrated=true;}
    if(w.episodes===undefined){w.episodes=[];migrated=true;}
  });
  if(migrated) await saveWorks();
  settings=Object.assign(settings,(await sget(KS))||{});
  $('#safeBtn').classList.toggle('on',settings.safe);
  render();
  paintBackupBar();
  handleShare();
})();
})();
